<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Framework Workbench">
  <!-- Two overlapping frames: the product is three frameworks read against each other.
       Opaque tile so the mark holds on a 16px browser tab. -->
  <rect width="32" height="32" rx="8" fill="#111114"/>
  <rect x="5" y="5" width="15" height="15" rx="3.5" fill="none" stroke="#2997ff" stroke-width="2.4"/>
  <rect x="12" y="12" width="15" height="15" rx="3.5" fill="#15304b" stroke="#7ec8ff" stroke-width="2.2"/>
</svg>

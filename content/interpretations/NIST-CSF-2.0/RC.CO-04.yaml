control_id: NIST-CSF-2.0:RC.CO-04
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「安全事件刚平稳，对外一句话把舆情引爆」——事故应对得再好，面向客户、监管和公众的通报口径不统一或未经批准，会二次伤害信任并招致合规追责。
    basis: inferred
  plain_zh:
    value: 对外说灾后恢复进展，必须走批准过的渠道、用批准过的措辞。各部门不能各说各话，更不能拿临时想到的词直接发。
    basis: inferred
  practice:
    value:
      '1': 明确了指定对外发言人；恢复期间任何对外通报前，有口头或邮件审批。
      '2': 有书面沟通计划，列出获准渠道与标准模板；每次对外发布有记录，含审批人与发布时间。
      '3': 发布话术与渠道在事件响应流程里预设并演练过；审批动作系统留痕；发布内容与恢复状态自动同步，避免口径过期。
    basis: inferred
  evidence:
    value: 事件沟通计划、发言人指派文件、对外公告样稿与审批链记录（邮件或工作流）、演练时模拟发布脚本。
    basis: inferred
  common_myth:
    value: 以为「有发言人就行」，但发言人讲什么并不是自己说了算，对外口径得先获批。常见错法是：法务、公关、技术各发各的，技术人员跟客户直接说细节，没人拦。
    basis: inferred
  auditor_asks:
    value:
    - 这次事件的对外公告是谁批准的？审批记录在哪？
    - 客户问恢复时间，你们有标准答法吗？谁制定、谁批准、在哪个系统里留痕？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

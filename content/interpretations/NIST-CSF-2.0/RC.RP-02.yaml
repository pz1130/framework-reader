control_id: NIST-CSF-2.0:RC.RP-02
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「灾备演练做过了、预案也写了，但真出事儿时不知按什么顺序恢复、恢复谁、恢复多少」——恢复动作没有取舍标准，资源有限时只能拍脑袋，核心业务反而等最久。
    basis: inferred
  plain_zh:
    value: 把「出事后先恢复什么、恢复到什么程度、按什么次序、谁来执行」这件事选定、限定范围、排好优先级，然后真做出来。
    basis: inferred
  practice:
    value:
      '1': 有恢复预案，写明关键系统的恢复顺序与负责人；重大事故后按预案执行过基本恢复。
      '2': 恢复优先级与业务影响分析挂钩，按 RTO/RPO 分档；定期演练覆盖主要场景，演练后修订预案并留记录。
      '3': 恢复动作与依赖关系（系统、数据、人员、外部服务）自动联动；演练含故障注入与资源受限场景；恢复结果可量化比对目标。
    basis: inferred
  evidence:
    value: 恢复预案及版本历史、业务影响分析与 RTO/RPO 分级表、演练计划与总结报告、演练中暴露问题的整改记录、恢复负责人名单及联系方式、重大事故后的复盘报告。
    basis: inferred
  common_myth:
    value: 以为「预案写得很厚、演练也算过了」就算达标。真正要审的是演练时有没有人按优先级取舍——好多团队演练从不设资源约束，恢复顺序永远照本宣科，真出事发现核心系统依赖的辅助系统没在清单里。
    basis: inferred
  auditor_asks:
    value:
    - 演练时资源只够恢复两个系统，按什么标准先恢复哪个？标准写在哪？
    - 上一次演练后，预案里哪些恢复步骤被改了？谁审核的？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

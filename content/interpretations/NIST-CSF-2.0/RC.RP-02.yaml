control_id: NIST-CSF-2.0:RC.RP-02
locale: en
state: draft
fields:
  intent:
    value: The concern is that "disaster recovery drills have been conducted and plans have been written,
      but when a real incident occurs, it is unclear in what order to recover, what to recover, and to
      what extent" — recovery actions lack prioritization criteria, so when resources are limited, decisions
      are made on the fly, and core business ends up waiting the longest.
    basis: inferred
  plain_zh:
    value: Define and scope "what to recover first after an incident, to what extent, in what order, and
      who executes it," prioritize it, and then actually carry it out.
    basis: inferred
  practice:
    value:
      '1': There is a recovery plan that specifies the recovery order and responsible persons for critical
        systems; after a major incident, basic recovery has been executed according to the plan.
      '2': Recovery priorities are linked to business impact analysis, with tiers based on RTO/RPO; regular
        drills cover major scenarios, and after drills, the plan is revised with records kept.
      '3': Recovery actions are automatically coordinated with dependencies (systems, data, personnel,
        external services); drills include fault injection and resource-constrained scenarios; recovery
        results can be quantitatively compared against targets.
    basis: inferred
  evidence:
    value: Recovery plan and version history, business impact analysis and RTO/RPO tiering table, drill
      plans and summary reports, rectification records for issues exposed during drills, list of recovery
      responsible persons and contact information, and post-incident review reports after major incidents.
    basis: inferred
  common_myth:
    value: Assuming that "a thick plan and completed drills" mean compliance. What really needs to be
      audited is whether anyone made prioritization trade-offs during drills — many teams never set resource
      constraints in drills, and the recovery order is always followed mechanically, only to find that
      auxiliary systems on which core systems depend are not on the list when a real incident occurs.
    basis: inferred
  auditor_asks:
    value:
    - During a drill, if resources are only enough to recover two systems, what criteria determine which
      ones to recover first? Where are the criteria documented?
    - After the last drill, which recovery steps in the plan were changed? Who reviewed the changes?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-CSF-2.0:RS.AN-08
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是应急响应一开始就把事件量级估错——估小了，投入的资源不够，影响蔓延；估大了，关键系统被过度隔离，业务损失被二次放大。事件响应的所有优先级与资源调度都建立在对量级的判断上，这个判断错了，后面都是错的。
    basis: inferred
  plain_zh:
    value: 事件发生后要有人对影响范围、严重程度和波及系统做出估计，并且这个估计要经得起验证——不是一个人拍脑袋说「不太严重」，而是有依据、有交叉确认、事后能用实际影响来校准。
    basis: inferred
  practice:
    value:
      '1': 事件响应流程里规定必须做影响评估；有对应表单或模板；由当值分析师填写量级判断。
      '2': 有量级评估的明确定义与分级标准；评估过程会收集证据（如受影响资产清单、数据泄露可能性）；评估结果需要第二人复核或主管审批。
      '3': 评估与验证被嵌入响应工具链——关联资产台账、漏洞情报与业务影响力数据；事后用实际损失复盘并校准评估模型；评估结论随时间推移自动触发对初始判断的修订。
    basis: inferred
  evidence:
    value: 包含量级估计的事件记录（工单/IR报告）、分级标准定义文件、复核或审批记录、事后复盘或教训总结、评估模型更新日志。
    basis: inferred
  common_myth:
    value: 以为「有事件分级表、填了 SLA 和上报时间」就等于完成了量级估计。分级表只是输入条件——如果没人把攻击路径、受影响的系统、是否有数据跨境或业务连续性风险的信息填进去，那个「紧急/重大」的勾只是流程道具，不是估算。
    basis: inferred
  auditor_asks:
    value:
    - 这个事件当时定为『重大』，判断依据是哪几条具体证据？谁复核过？
    - 事后复盘有没有验证当初的量级判断？往下调或往上调了，改了什么流程？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-CSF-2.0:PR.PS-01
locale: en
state: draft
fields:
  intent:
    value: The concern is that 'no one can clearly explain the software and configurations running on
      servers' — not knowing what is installed in the system, what versions are running, or what changes
      have been made without records. In the event of an incident, it is impossible to reproduce or quickly
      restore, and malicious file modifications go undetected.
    basis: inferred
  plain_zh:
    value: 'Manage the configuration of IT systems: there must be a set of methods to define, record,
      approve, deploy configurations and software changes, and be able to answer at any time ''what is
      the current state of the system, who authorized it to become this way, and where it differs from
      the baseline.'''
    basis: inferred
  practice:
    value:
      '1': There is a configuration management policy document; production environment changes require
        approval; know what software and versions are installed on important systems.
      '2': There are configuration management processes and tools; key changes go through approval with
        records; asset inventories or configuration lists are regularly reviewed and checked for discrepancies;
        important changes are tested before going to production.
      '3': Configuration baselines are documented and compared through automated scanning tools; systems
        that do not meet the baseline can be blocked or alerted; changes are fully audited and traceable;
        software installation is controlled, making it difficult to deploy unapproved software.
    basis: inferred
  evidence:
    value: Configuration management policy and process documents, change approval records (change tickets
      or work orders), software and hardware asset inventories with recent review records, configuration
      baseline documents, configuration scanning or verification reports against baselines, and records
      of software installation control or whitelist policy enforcement.
    basis: inferred
  common_myth:
    value: 'The misconception is that ''deploying a CMDB or installing a configuration scanning tool equates
      to doing configuration management.'' Tools are only means; what is truly audited is not how much
      data is on the tool''s page — but whether that data is actually driving people to act: Are changes
      truly approved before release? After configuration drift is detected, does someone go back and restore
      the baseline? Without a closed-loop process, what is stored in the CMDB is merely an outdated static
      list.'
    basis: inferred
  auditor_asks:
    value:
    - In the most recent instance of configuration drift found in the production environment, which machine,
      what configuration, and how was it handled? Where is the record?
    - If a developer modifies a configuration file and pushes it directly to production, can the process
      stop it? When was the last time this happened?
    - How is the software installation whitelist or control implemented? What process is followed when
      temporarily installing a tool software outside of production?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

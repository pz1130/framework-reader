control_id: NIST-CSF-2.0:PR.IR-03
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「系统只在正常情况设计好了、一到故障或攻击就崩」——冗余、降级、故障转移这些韧性要求必须设计进机制里，而不是出事后再临时救火。
    basis: inferred
  plain_zh:
    value: 要在系统里真正做出应对正常和异常情况的韧性机制：资源够用、有冗余、能降级、能隔离、能自愈，而且这些是设计出来的，不是靠运气。
    basis: inferred
  practice:
    value:
      '1': 关键系统有明确的冗余或备份安排；有基础的故障转移或重启机制；知道单点故障在哪。
      '2': 韧性要求写进系统设计文档；关键组件有冗余且定期演练切换；有降级运行模式并有操作手册。
      '3': 韧性目标量化并在架构层落实；异常场景（断网、宕机、注入攻击）有自动化响应与自愈；韧性测试纳入发布门禁。
    basis: inferred
  evidence:
    value: 系统架构图中的冗余设计、韧性需求与设计文档、故障切换演练记录、容量与压力测试报告、降级模式操作手册、自愈脚本或编排策略。
    basis: inferred
  common_myth:
    value: 以为「服务器做了双机热备、数据库有主从」就算有韧性机制。双机只解决硬件单点；网络分区、流量突增、上游依赖故障、恶意注入这些异常场景下能否降级和自愈，才是审计员真正会追问的。
    basis: inferred
  auditor_asks:
    value:
    - 依赖的第三方服务不可用时，系统会怎么表现？降级路径演练过没有？
    - 同城双活或异地多活是怎么做到数据一致的？故障切换的 RTO/RPO 依据是什么？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

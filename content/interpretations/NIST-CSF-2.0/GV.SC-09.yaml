control_id: NIST-CSF-2.0:GV.SC-09
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「供应链安全挂在采购部门或安全部门各自为政，和公司整体风险治理脱节」——供方出事影响业务连续性或合规时，没人能把它纳入企业级风险决策，也没人持续盯着供方表现直到产品退市。
    basis: inferred
  plain_zh:
    value: 把供应链安全做法融进企业网络安全和风险管理体系，并且从选型、采购、使用到退市，全程盯着供方表现，不能签完合同就不管。
    basis: inferred
  practice:
    value:
      '1': 有供应链安全要求和供方清单；采购流程里纳入基本安全条款；能指出谁负责供方风险。
      '2': 供方风险分级并进入企业风险登记；有定期的供方表现评审与安全复评；问题有升级路径和处置记录。
      '3': 供应链安全指标纳入企业级风险报告；关键供方有全生命周期监控与退出预案；供方变更（如转包、产品停售）能触发重新评估。
    basis: inferred
  evidence:
    value: 供方风险登记与企业风险报告、供应链安全政策、采购合同中的安全条款与供方表现评审记录、供方生命周期管理流程文件、关键供方退出或切换演练纪要。
    basis: inferred
  common_myth:
    value: 以为「安全问卷做完了、合同条款签了，这条就算完成」——问卷和条款只是入场门槛。审计员真正要看的是供方风险有没有进入企业级风险登记、有没有持续评审供方表现、产品停售或供方转包时有没有触发重新评估。只做一次评估不算「integrated」。
    basis: inferred
  auditor_asks:
    value:
    - 你们关键供方的风险等级，上一次是企业风险委员会议什么时间讨论的？记录在哪？
    - 供方产品宣布停售或供方转包核心组件时，你们的评估流程是怎么触发的？
    - 请指出从采购合同签订到产品退市，供方风险由哪个岗位以什么频率跟进，依据哪份文件？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

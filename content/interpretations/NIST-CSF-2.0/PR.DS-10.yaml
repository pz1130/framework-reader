control_id: NIST-CSF-2.0:PR.DS-10
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「数据只在磁盘和传输中受保护」的盲区——数据在内存、CPU 缓存、寄存器里被处理时，既不能被人读走，也不能被篡改，更不能因为进程崩溃或系统残留导致下个进程读到上一手的数据。
    basis: inferred
  plain_zh:
    value: 处理中的数据（在内存里、CPU 里、计算过程中）也要保证保密性、完整性和可用性——该加密的加密、该隔离的隔离、该清理的清理，不能只盯着存储和网络。
    basis: inferred
  practice:
    value:
      '1': 服务器内存和磁盘加密开启；明确定义数据使用中保护的责任人；生产环境不允许明文口令在内存中长期驻留。
      '2': 有进程与内存隔离机制；关键数据在内存中处理完即清零；对内存转储（dump）有访问控制；虚拟化平台开启内存加密（如机密计算或等价手段）用于高敏感数据。
      '3': 机密计算或同态加密用于高敏感数据处理；内存清理与生命周期有自动验证工具；能证明代码运行时数据不可被宿主或管理员读取。
    basis: inferred
  evidence:
    value: 内存加密与清理策略文件、机密计算或隔离环境的配置记录、内存转储访问控制清单、高敏感数据内存生命周期管理方案、容器或虚拟化隔离及加固配置基线、相关操作日志。
    basis: inferred
  common_myth:
    value: 以为「开了全盘加密就等于保护了使用中的数据」——那是落盘加密，只管静止。数据被进程读进内存后是明文存在 RAM 里的，不处理内存保护，等于把文件从保险柜拿出来摊在桌上办公。
    basis: inferred
  auditor_asks:
    value:
    - 最高敏感的数据在内存里是明文还是密文？有没有做过内存转储并成功读到明文的验证？
    - 进程崩溃或异常退出后，内存页如何清理？上级进程退出，子进程还持有密钥的场景怎么兜底？
    basis: inferred
  regional_note:
    value: 欧洲在 DORA 与云服务背景下对使用中加密的期望明显更高，尤其金融行业审计员会追问云租户能否证明云厂商管理员读不到其数据处理过程；美国审计员相对停留在内存保护、进程隔离和转储审计层面，主动谈机密计算的较少。
    basis: inferred

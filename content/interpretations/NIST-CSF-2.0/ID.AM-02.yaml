control_id: NIST-CSF-2.0:ID.AM-02
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「不知道自己有什么」——绕过的影子资产、版本停更但仍暴露的组件、一上线的临时服务没人认领。没有可靠清单，后续的漏洞管理、补丁、风险评估全都白做。
    basis: inferred
  plain_zh:
    value: 把组织管着的软件、服务和系统列出清单，并持续更新，做到随时能说清当前手上到底有哪些资产。
    basis: inferred
  practice:
    value:
      '1': 有静态资产台账（Excel 或 CMDB），能列出主要服务器、终端、核心业务系统。
      '2': 台账有明确负责人和更新频率；网络扫描、云账号、域控等来源定期对齐；手工变更流程让新设备、新服务能进清单。
      '3': 资产发现以自动采集为主（扫描、代理、云 API），关键字段齐全（负责人、环境、版本、暴露面）；持续比对实际环境，未登记的资产有告警和处置流程。
    basis: inferred
  evidence:
    value: 资产台账或 CMDB 记录（含负责人、IP、版本、环境）、资产发现任务的扫描报告或 API 拉取记录、台账与实际环境的差异比对报告、未登记资产的处置记录。
    basis: inferred
  common_myth:
    value: 以为「用某款网络扫描器跑过一遍」就等于有资产清单。扫描器只能看到应答的主机，看不到云上关闭的状态、离线但可接人的笔记本或扫码当天没开机的设备——单次扫描不是资产台账，更替代不了持续更新。
    basis: inferred
  auditor_asks:
    value:
    - 你们怎么发现未经申报就上线的系统？最近一次发现是什么时候、谁负责处理？
    - 资产清单里有多少项超过 90 天没有确认是否还在管？
    - 开发环境和生产环境的资产是不是在同一份清单里？边界怎么分？
    basis: inferred
  regional_note:
    value: 欧洲审计员在 NIS2 落地后更关心清单是否覆盖关键服务的完整供应链组件；美国常用在 SOC 2 与 FedRAMP 审查里，以 CMDB 准确性与自动发现为主要证据，欧方更追「能不能用清单说清依赖关系」。
    basis: inferred

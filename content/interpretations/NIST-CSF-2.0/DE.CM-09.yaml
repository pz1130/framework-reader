control_id: NIST-CSF-2.0:DE.CM-09
locale: en
state: draft
fields:
  intent:
    value: The concern is that monitoring only focuses on network traffic and cannot see what is running
      on servers—issues with hardware, software, runtime environments, and data itself are often more
      covert than network attacks. Without monitoring these, mining programs, unauthorized software, configuration
      drift, and data anomalies cannot be detected.
    basis: inferred
  plain_zh:
    value: Computing hardware, operating systems, application software, runtime environments, and the
      data they store should all be included in monitoring to detect anomalous events, not just network
      traffic.
    basis: inferred
  practice:
    value:
      '1': Basic host monitoring and log collection are in place, capable of detecting server outages
        and abnormal CPU/memory spikes; system logs are enabled on critical servers.
      '2': Monitoring covers hardware health, software asset inventory, runtime configuration, and critical
        data integrity; a centralized log platform exists that can correlate network and host events;
        anomalies have alerting and response procedures.
      '3': Monitoring systematically covers all assets with automated inventory; configuration drift and
        file integrity are automatically detected and linked with change management; host events are correlated
        with threat intelligence to uncover covert threats; monitoring policies automatically update as
        assets change.
    basis: inferred
  evidence:
    value: Hardware monitoring dashboards and threshold alert records, software asset inventory and change
      records, centralized log platform onboarding list and query samples, file integrity monitoring alerts
      and handling records, configuration baseline audit reports.
    basis: inferred
  common_myth:
    value: Assuming that deploying EDR counts as monitoring hardware and runtime environments—EDR only
      covers process behavior on server endpoints; routing and switching devices, storage arrays, database
      runtime states, and configuration files often go unmonitored, which are exactly the blind spots
      auditors like to probe.
    basis: inferred
  auditor_asks:
    value:
    - Do you perform integrity monitoring on configuration files of network devices (switches, routers)?
    - Are there alerts for runtime configuration changes in database instances? When was the last alert?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

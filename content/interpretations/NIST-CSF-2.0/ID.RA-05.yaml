control_id: NIST-CSF-2.0:ID.RA-05
locale: en
state: draft
fields:
  intent:
    value: The concern is that the risk register is filled out and then forgotten—if threats, vulnerabilities,
      likelihood, and impact do not genuinely inform prioritization, risk analysis degenerates into a
      form-filling exercise, and response resources are always allocated to the loudest department rather
      than to the risks that most need treatment.
    basis: inferred
  plain_zh:
    value: When conducting risk analysis, threats, vulnerabilities, likelihood, and impact must all be
      considered, used to calculate inherent risk, and then prioritized accordingly.
    basis: inferred
  practice:
    value:
      '1': There is a risk list; the risk assessment template includes fields for threat, vulnerability,
        likelihood, and impact; those filling it out know that all four must be addressed.
      '2': There is a unified scoring standard; each risk is scored against the four factors, and an inherent
        risk value is calculated; treatment priorities explicitly reference the risk assessment results,
        not just subjective judgment.
      '3': Data for the four factors has supporting sources (e.g., threat intelligence, vulnerability
        scans, historical incidents); risk assessment results are linked to treatment decision systems;
        regular reassessment based on new threats and vulnerabilities, with priorities automatically adjusted
        as data changes.
    basis: inferred
  evidence:
    value: Risk assessment methodology documents, scoring standards, risk register (including scores for
      the four factors and inherent risk values), records of treatment prioritization, and evidence of
      treatment actions triggered by assessment results.
    basis: inferred
  common_myth:
    value: The misconception is that making the four factors into dropdown menus and selecting options
      is sufficient. Without a unified definition, different people's 'high likelihood' means different
      things—some base it on historical event frequency, others on industry rumors. If scoring standards
      are not unified, the register is just digital garbage.
    basis: inferred
  auditor_asks:
    value:
    - What objective criteria correspond to 'likelihood = high' and 'impact = high'? In which document
      are they written?
    - Are treatment priorities directly derived from the risk scoring ranking, or have they been adjusted
      by management based on experience? What is the basis for any adjustments?
    basis: inferred
  regional_note:
    value: European auditors tend to focus on whether the comparison between inherent and residual risk
      is clearly presented—in the context of NIS2 and DORA, both are often required to be shown; American
      auditors prefer to see whether the algorithm for the four factors is reproducible and whether scores
      are reviewed by someone. Both sides recognize 'sourced and traceable,' but Europe places stricter
      demands on narrative completeness.
    basis: inferred

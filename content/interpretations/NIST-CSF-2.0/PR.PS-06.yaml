control_id: NIST-CSF-2.0:PR.PS-06
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「安全开发只是一次性培训或上线前的检查清单」——如果开发实践没有从需求到发布持续被监控，漏洞与不合规会随迭代悄悄积累，等审计或出事时才暴露。
    basis: inferred
  plain_zh:
    value: 把安全开发的做法（如威胁建模、代码审查、安全测试）嵌入整个研发流程，并且持续盯它们的执行情况和效果，而不是只在某个节点做一次。
    basis: inferred
  practice:
    value:
      '1': 有安全开发政策或指南；关键流程节点（如需求评审、发布前）有安全活动；团队知道要做什么。
      '2': 安全活动按风险分级嵌入各阶段；执行有记录，如威胁建模文档、缺陷跟踪；定期抽查执行情况并推动整改。
      '3': 安全活动由工具与平台支撑，如 CI/CD 内嵌扫描与门禁；度量指标（如缺陷密度、修复时长）定期汇报；发现偏差会自动拦截。
    basis: inferred
  evidence:
    value: 安全开发政策与流程文档、威胁建模与代码审查记录、SAST/DAST 扫描报告、CI/CD 门禁配置与阻断日志、度量 Dashboard 或定期报告。
    basis: inferred
  common_myth:
    value: 以为「固件更新由供应商负责，我们只做整机发布，所以不适用」——只要你在组装、配置或定制过程中有代码或脚本参与，这条就适用；审计员会追问你有没有对这些环节做安全验证。
    basis: inferred
  auditor_asks:
    value:
    - 你的 CI/CD 流水线里，扫描和门禁是从哪个环节开始生效的？
    - 一次发布在什么情况下可以跳过安全门禁？谁有权限，留什么审计记录？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-CSF-2.0:RS.MA-01
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「事件处置只在自家围墙内转」——供应链、云服务商、外包运维这些第三方手里掐着你的关键资产，出事时不联动，他们那边火烧起来你这边还不知道，等发现时账已经算不清了。
    basis: inferred
  plain_zh:
    value: 应急预案不是给自己看的，事发时要按约定把相关方拉进来一起处置，该通知的通知、该升级的升级、该接管的接管，并且平时就要有对接窗口。
    basis: inferred
  practice:
    value:
      '1': 应急预案里写明关键第三方是谁、联系方式是什么、什么事件必须通知，出事时能找到人。
      '2': 与关键第三方有正式联动协议，明确事件通报时限、各自职责、升级路径，且至少演练过一次或做过桌面推演。
      '3': 第三方联动是应急预案的固定环节，包含实时情报同步接口，每次真实事件或演练后有复盘，协议随供方变更而更新。
    basis: inferred
  evidence:
    value: 应急预案里的第三方联络清单、与供方签的事件联动或通报协议、演练或真实事件的联动记录、复盘会议纪要与改进项。
    basis: inferred
  common_myth:
    value: 以为「甲方和安全乙方都有应急预案」就等于满足联动。两边各备各的预案、没有约定通报时限和对接人，事件发生时互相打不通电话、口径对不上，等于没联动。
    basis: inferred
  auditor_asks:
    value:
    - 去年真实事件或演练里，有几次是按预案通知了第三方的？距发现到通知过了多久？
    - 关键云服务商变更了接口人，你们的应急联络清单同步更新的流程是什么？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

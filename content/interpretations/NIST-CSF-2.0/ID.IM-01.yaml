control_id: NIST-CSF-2.0:ID.IM-01
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「评估完就完事」——演练、审计、红队、事故复盘得出来的问题没人跟踪，整改建议躺在报告里，风险原地踏步。
    basis: inferred
  plain_zh:
    value: 把各种评估（演练、审计、测试、事件复盘）中发现的改进点收集起来，排优先级，真正落到流程、技术或人员上，并验证改完了。
    basis: inferred
  practice:
    value:
      '1': 评估报告里有明确的改进建议清单；有人负责跟进；下次评估时能说清楚改了没改。
      '2': 改进项进入正式的整改跟踪机制（如问题台账或风险登记册），有优先级、负责人、截止日期；定期回顾进展。
      '3': 改进项与风险管理、变更管理联动；系统能自动追踪状态并提醒；重大改进完成时有验证记录；评估迭代中能看到前次问题确认关闭。
    basis: inferred
  evidence:
    value: 评估报告中的改进建议清单、问题跟踪台账（含优先级/负责人/状态）、整改完成凭证（工单、配置变更记录、复测结果）、管理层对整改状态的定期回顾纪要。
    basis: inferred
  common_myth:
    value: 以为「汇报过评估结果、PPT 里列了整改方向」就算识别了改进。没有责任人、没有截止日期、没有验证环节，清单只是愿望清单，审计员翻台账第一页就能看出有没有闭环。
    basis: inferred
  auditor_asks:
    value:
    - 上一次演练/审计提出的改进项中，有多少已关闭？关闭的证据是什么？
    - 改进项的优先级是谁定的、依据什么标准？滞后项有上报机制吗？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

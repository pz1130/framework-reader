control_id: NIST-CSF-2.0:GV.RR-01
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「一把手觉得安全是技术部门的事」——出了大事最高层说不知情、安全部门背着锅。责任悬空时，资源、拍板权、问责链全部没有抓手。
    basis: inferred
  plain_zh:
    value: 把网络安全风险的责任和权限明确安在组织最高层头上，由他们负责、被问责，并且要在整个组织里带出认风险、讲伦理、持续改进的文化，而不能只靠安全部门自己推动。
    basis: inferred
  practice:
    value:
      '1': 管理层有一名明确负责人，批准过安全策略；重大安全事项能到达最高层。
      '2': 网安风险进入高管会议常规议题；有正式的风险接受与升级机制；管理层定期听取并决策重大风险。
      '3': 管理层薪酬、考核或公司披露中体现网安责任；文化指标（如举报、通报、改进建议）有数据支撑并纳入管理回顾。
    basis: inferred
  evidence:
    value: 任命或授权文件、董事会/高管会议关于网络风险的纪要、安全策略的批准签字页、风险接受与升级记录、领导层参与的培训或文化宣贯记录。
    basis: inferred
  common_myth:
    value: 以为「CISO 是最高负责人」就算领导层尽责——审计员要看责任是不是落在拥有资源与人事权的那一层，安全负责人只是执行者，不能替一把手背责任。
    basis: inferred
  auditor_asks:
    value:
    - 公司董事会或最高管理层上一次正式审议网络风险是什么时候？纪要里做了什么决策？
    - 如果重大风险被业务拒绝整改，谁能拍板？这个人的批准确认文件在哪里？
    - 管理层如何证明自己理解公司面临的主要网络风险，而不只是听安全部门汇报？
    basis: inferred
  regional_note:
    value: 欧洲在 NIS2 的背景下，董事会个人对网络安全失职可能要负法律责任，审计员会更严地核查个人问责记录；美国审计员通常看 SEC 披露要求是否触发、以及高管层是否有实质性参与，个人追责链条相对松散。
    basis: inferred

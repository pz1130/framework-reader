control_id: NIST-CSF-2.0:PR.AA-02
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「有账号就能进」——身份没有经过可信核验就发放凭证，攻击者可以靠伪造身份、撞库或内部人员虚报身份获得合法入口，后续所有访问控制都建立在一个不可信的地基上。
    basis: inferred
  plain_zh:
    value: 给用户发账号和凭证之前，必须根据使用场景（是内部员工、合作伙伴还是外部客户）做相应强度的身份核验，确保这个身份是真的，并且身份和凭证是绑定的。
    basis: inferred
  practice:
    value:
      '1': 内部员工入职时进行基本身份核验（如身份证件核对）；统一身份源（如 HR 系统）是账号创建的唯一依据。
      '2': 不同场景（员工/外包/客户/API）有明确的身份核验等级要求；高风险角色（如管理员、财务）有增强核验流程；身份变更（改名、转岗）能同步到凭证。
      '3': 身份核验过程有审计日志，能追溯每个账号创建时的核验依据；对特权账号实施多因素认证且绑定到已验证身份；系统能检测并阻止身份复用或凭证与身份不匹配的情况。
    basis: inferred
  evidence:
    value: 身份核验流程文档（分场景）、入职/账号创建工单中的核验记录、身份源系统截图、MFA 绑定记录、身份核验失败的日志或报告。
    basis: inferred
  common_myth:
    value: 以为「让 HR 系统建了账号」就等于完成了身份核验。HR 建号只是录入信息，如果系统之间是手动同步、或外包人员由项目组口头申请建号，那身份实际上没有被核验过——账号和真实的人对不上。
    basis: inferred
  auditor_asks:
    value:
    - 外包人员或临时人员的身份是谁核验的？核验了什么证件？记录在哪里？
    - 一个离职员工的身份能否被拿来重新建号？系统里怎么防止身份被复用？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

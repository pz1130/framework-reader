control_id: NIST-CSF-2.0:RS.AN-06
locale: zh-CN
state: draft
fields:
  intent:
    value: 防止调查过程中做了什么无从追溯——应急响应时是谁、在何时、做了什么操作、依据什么决定，如果这些不留痕，事后复盘、追责、法律举证和监管问询都站不住脚，甚至调查本身会被质疑为删改证据。
    basis: inferred
  plain_zh:
    value: 安全事件调查期间，所有动作（包括查询、取证、隔离、封禁、变更、分析判断）都要留记录；这些记录本身不能被篡改，还要能说清它们是怎么来的、原始出处是哪里。
    basis: inferred
  practice:
    value:
      '1': 调查操作至少记入变更工单、操作日志或邮件；关键步骤有责任人标记；日志留存周期明确。
      '2': 调查过程有专门事件记录（时间线+操作人+操作内容+依据）；日志防篡改（如只读归档、WORM）；来源信息（时间、主机、账号）可提取。
      '3': 调查环境本身有全程操作审计（如堡垒机、终端记录、命令日志）；记录自动汇入案件时间线；每一步操作能关联到原始日志出处，支持完整取证链。
    basis: inferred
  evidence:
    value: 事件调查记录（时间线、操作日志、截图、取证命令输出）、堡垒机或终端审计记录、日志完整性校验证明、调查报告中关键动作与原始日志的对应关系。
    basis: inferred
  common_myth:
    value: 以为「所有服务器日志统一留存」就等于满足这条——调查时手动敲的命令、临时创建的账号、手动改的防火墙策略，如果只落在工程师脑子里而不记进案件记录，统一日志留存覆盖不了。调查过程的动作链完整保存在案件记录里才算数。
    basis: inferred
  auditor_asks:
    value:
    - 这次事件调查中，执行过哪些关键操作？每一步操作记录在哪里，能不能指出来？
    - 调查记录的这些日志，你凭什么相信它没被改过？校验机制是什么？
    - 事件报告里的分析结论，能对应到原始日志的具体出处吗？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

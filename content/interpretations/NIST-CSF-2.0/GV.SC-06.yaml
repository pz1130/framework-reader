control_id: NIST-CSF-2.0:GV.SC-06
locale: en
state: draft
fields:
  intent:
    value: The concern is about 'cooperate first, check details later'—signing contracts or establishing
      third-party relationships without prior planning and due diligence, turning risk review into post-purchase
      remediation, leading to wrong supplier selection, terms without safeguards, and catastrophic dependencies.
    basis: inferred
  plain_zh:
    value: Before signing contracts or formally establishing third-party relationships, conduct planning
      and due diligence to understand the other party thoroughly, then decide whether and how to cooperate.
    basis: inferred
  practice:
    value:
      '1': Key suppliers undergo basic due diligence before contracting, including qualification checks
        and security questionnaires; contracts include minimum security and compliance requirements.
      '2': There is a formal supplier admission process; due diligence results and risk ratings go into
        approval; high-risk suppliers have documented handling plans (e.g., additional remediation, insurance,
        or alternative paths).
      '3': Due diligence scope scales by risk tier, covering security, compliance, and operational resilience;
        contract terms are linked to due diligence results, with exit and transfer rights reserved; due
        diligence quality is reviewed continuously during the relationship.
    basis: inferred
  evidence:
    value: Supplier admission process and approval records, due diligence questionnaires and results,
      contract security clause lists, handling and exit plans for high-risk suppliers, and documents of
      due diligence results and risk ratings.
    basis: inferred
  common_myth:
    value: Thinking 'the procurement department says this supplier is fine, so the technical team doesn't
      need to be involved'—if due diligence only involves business and legal, no matter how good the price
      negotiation, technical security risks still walk in naked.
    basis: inferred
  auditor_asks:
    value:
    - What due diligence was done on this supplier before contract signing? Where are the investigation
      results and risk rating records?
    - If due diligence reveals high risk, what remediation or exit clauses are written into the contract?
      Who implements them?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

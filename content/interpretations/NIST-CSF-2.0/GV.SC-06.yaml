control_id: NIST-CSF-2.0:GV.SC-06
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「先合作、后看底细」——签合同或建立第三方关系之前，不做规划与尽职调查，把风险审查变成了买完后的补救，导致选错供应商、条款没兜底、灾难性依赖。
    basis: inferred
  plain_zh:
    value: 在签合同或正式建立第三方关系之前，先做规划与尽职调查，摸清对方底细，再决定要不要合作、怎么合作。
    basis: inferred
  practice:
    value:
      '1': 关键供方在签约前做基本尽调，包括资质核查与安全问卷；合同包含最低安全与合规要求。
      '2': 有正式的供应商准入流程，尽职调查结果与风险评级进审批；高风险供方有书面处置方案（如额外补救、保险或替代路径）。
      '3': 尽调范围按风险档位伸缩，覆盖安全、合规与运营韧性；合同条款与尽调结果联动，并留退出与转移权利；合作关系存续期内持续对尽调质量复盘。
    basis: inferred
  evidence:
    value: 供应商准入流程与审批记录、尽职调查问卷与结果、合同安全条款清单、高风险供方处置与退出预案、尽调结果与风险评级文档。
    basis: inferred
  common_myth:
    value: 以为「采购部门说这家供应商没问题，技术团队不用参与」——尽调如果只有商务与法务参与，价格谈得再漂亮，技术安全风险照样裸奔进门。
    basis: inferred
  auditor_asks:
    value:
    - 这个供方签合同前做过哪些尽调？调查结果和风险评级记录在哪？
    - 如果尽调发现高风险，合同里写了哪些补救或退出条款？谁来落实？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

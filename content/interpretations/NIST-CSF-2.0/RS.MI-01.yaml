control_id: NIST-CSF-2.0:RS.MI-01
locale: en
state: draft
fields:
  intent:
    value: The concern is about 'no one containing or daring to disconnect after an intrusion is discovered'
      — if the path used by the attacker is not severed, malicious activity can spread laterally within
      the system, digging deeper, and turning a single-point incident into a major event with an uncontrollable
      scope.
    basis: inferred
  plain_zh:
    value: 'Once an incident is confirmed, there must be clear actions and authority to contain the impact:
      sever network paths, isolate hosts, disable accounts, block entry points, and the actions must be
      documented and have an accountable person.'
    basis: inferred
  practice:
    value:
      '1': There is an incident response plan that specifies under what circumstances network disconnection
        or isolation can be performed; frontline personnel have the authority to act first and report
        later in emergencies, with approval obtained afterwards.
      '2': 'There are predefined isolation strategies (at least two of the three: network, host, cloud
        account) and desktop exercises have been conducted; every isolation action has a timeline record.'
      '3': Containment actions incorporate automated or semi-automated orchestration (e.g., SOAR playbooks);
        balance drills have been conducted between impact on production availability and containment efficiency;
        isolation failures can trigger an escalation path.
    basis: inferred
  evidence:
    value: The incident response plan includes a containment and isolation section, records of at least
      one desktop exercise or practical drill, a timeline screenshot of containment for a recent incident
      (minute-level records from detection to disconnection), a list of isolated assets, and approval
      forms for de-isolation.
    basis: inferred
  common_myth:
    value: The misconception is that 'isolation means unplugging the network cable' or 'kicking the server
      out of the domain.' In real scenarios, attackers often move laterally through legitimate accounts
      or cloud APIs — unplugging the network cable cannot stop lateral movement within a cloud tenant;
      there must be a combined containment approach in cloud environments using security groups/access
      policies/account revocation, not just physical network disconnection.
    basis: inferred
  auditor_asks:
    value:
    - In the most recent real incident, how long did it take from confirming the intrusion to completing
      network isolation? Which record can prove this?
    - When a super admin account in the cloud environment is compromised, what measures do you use to
      isolate? Or do you only remove the public IP from that ECS?
    - Do isolation actions require going through an approval process first? Who has the authority to bypass
      the process and act directly in emergencies?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

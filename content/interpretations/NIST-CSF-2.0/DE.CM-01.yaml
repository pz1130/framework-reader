control_id: NIST-CSF-2.0:DE.CM-01
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「边界防火墙开着、盯着流量，但内网东西向流量和终端行为没有监控——横向移动和钓鱼成功落地后没人察觉」。网络监控必须覆盖关键网段与网络服务，发现潜在恶意事件并告警，而不是只看互联网入口的流量。
    basis: inferred
  plain_zh:
    value: 对入网、出网和东西向流量以及网络设备上的服务做持续监控，抓出可能构成威胁的事件；监控不是装个流量探针就行，要覆盖重要网段、要能看到加密流量之外的行为线索、要有告警和响应流程。
    basis: inferred
  practice:
    value:
      '1': 边界和核心交换处有流量监控或探针；IDS/IPS 开着且规则加载；有告警接收与响应联系人。
      '2': 监控覆盖内外网关键网段与关键网络服务；告警有分级与正常响应时限；探针与规则变更、告警处理均有记录。
      '3': 监控通道与纵深防御体系打通，与日志分析和威胁情报联动；对加密流量、DNS 隧道、异常协议行为有检测手段；定期做监控覆盖盲区评审与探测有效性测试。
    basis: inferred
  evidence:
    value: 网络拓扑与监控覆盖图、IDS/IPS 规则库版本与加载记录、告警工单与处理记录、带宽与协议基线分析报告、定期监控有效性测试报告。
    basis: inferred
  common_myth:
    value: 以为部署了 IDS 就算做到监控了
    basis: practitioner
  auditor_asks:
    value:
    - 只要人看的，就有失误的风险
    basis: practitioner
  regional_note:
    value: null
    basis: inferred

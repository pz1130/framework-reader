control_id: NIST-CSF-2.0:GV.OC-04
locale: en
state: draft
fields:
  intent:
    value: The concern is that enterprises only define 'what is critical business' from an internal perspective—what
      external stakeholders (customers, regulators, partners) truly rely on you to deliver. If no one
      articulates this, then in the event of disruption, recovery priorities could be completely reversed,
      and resources invested may not align with what others truly need.
    basis: inferred
  plain_zh:
    value: Identify the core objectives, capabilities, and services that external stakeholders (customers,
      regulators, key partners) expect you to provide, and ensure that relevant internal teams understand,
      reach consensus on, and can articulate them.
    basis: inferred
  practice:
    value:
      '1': There is a list or document identifying key services or objectives that external parties depend
        on; business line owners can articulate what they have committed to externally.
      '2': Key external services are mapped to internal supporting systems/processes; the list's validity
        is confirmed with business lines at least annually; updates are recorded when changes occur.
      '3': The external dependency list directly drives business impact analysis and recovery prioritization;
        key customers or regulators have written confirmation or contractual commitments; the board or
        senior management reviews and signs off regularly.
    basis: inferred
  evidence:
    value: List of key external services, mapping tables to internal systems/processes, meeting minutes
      of business line confirmation reviews, external commitment documents (e.g., SLAs, regulatory commitment
      letters), and change records for key services.
    basis: inferred
  common_myth:
    value: Assuming that copying the 'core systems' identified in the internal Business Impact Analysis
      (BIA) suffices. BIA is an internal perspective—what IT deems 'core' is not necessarily what external
      customers truly depend on as 'critical.' This requirement calls for aligning external commitments
      with internal support; having only a system list without defining external commitments will be exposed
      when an auditor asks, 'What are you contractually obligated to provide to customers?'
    basis: inferred
  auditor_asks:
    value:
    - When was the list of key external services last updated? Who is responsible for confirming its continued
      validity?
    - What are the 'critical deliverables' your company has committed to in external SLAs or contracts?
      How are these internally mapped to specific systems or teams?
    - When a business line owner believes a service is no longer critical, what process is followed to
      update this list?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

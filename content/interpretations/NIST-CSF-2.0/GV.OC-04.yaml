control_id: NIST-CSF-2.0:GV.OC-04
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是企业只从内部视角定义「什么是关键业务」——外部利益相关方（客户、监管、合作伙伴）真正依赖你交付的到底是什么。如果没人说清，一旦中断，恢复优先级可能完全做反，投入的资源也没对准别人真正要的东西。
    basis: inferred
  plain_zh:
    value: 把外部利益相关方（客户、监管机构、关键合作伙伴）指望你提供的核心目标、能力和服务梳理清楚，并且让内部相关团队都理解、形成共识、能讲出来。
    basis: inferred
  practice:
    value:
      '1': 有一份清单或文档，列明外部依赖的关键服务或目标；业务线负责人能说出自己对外承诺了什么。
      '2': 关键外部服务与内部支撑系统/流程做了映射；每年至少一次与业务线确认清单有效性；变更时有更新记录。
      '3': 外部依赖清单直接驱动业务影响分析和恢复优先级排序；关键客户或监管有书面确认或签约承诺；董事会或高管层定期审阅并签字。
    basis: inferred
  evidence:
    value: 外部关键服务清单、与内部系统/流程的映射表、业务线确认评审纪要、对外承诺文件（如SLA、监管承诺函）、关键服务变更记录。
    basis: inferred
  common_myth:
    value: 以为把内部业务影响分析（BIA）里标的「核心系统」抄一遍就算完成。BIA是内部视角——IT定的「核心」不等于外部客户真正依赖的「关键」。这一条款要求的是对外承诺与内部支撑的对接，光有系统清单没有对外承诺的定义，审计员一问「客户凭合同要求你们必须提供什么」就露馅。
    basis: inferred
  auditor_asks:
    value:
    - 外部关键服务清单最近一次更新是什么时候？谁负责确认它仍然有效？
    - 贵司对外SLA或合同承诺的「关键交付物」有哪些？内部是如何映射到具体系统或团队的？
    - 当业务线负责人认为某服务不再关键时，走什么流程去更新这份清单？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

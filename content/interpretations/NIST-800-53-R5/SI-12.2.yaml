control_id: NIST-800-53-R5:SI-12.2
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Defends against the failure mode where training datasets, test harnesses,
      and research samples become shadow copies of production PII - so when a contractor,
      a sandbox, a shared repo, or a research partner leaks them, the breach is real
      customer data, not synthetic data; and against the secondary failure where the
      organization cannot tell which environments actually held PII during an incident.
    basis: inferred
  plain_zh:
    value: When you build test/training/research datasets or use them in systems,
      strip or replace PII so the data looks real enough to be useful but cannot be
      tied back to actual people - and track where each dataset came from, who handled
      it, and when it was disposed of.
    basis: inferred
  practice:
    value:
      '1': A written rule that production data is not copied into test, training,
        or research environments as-is; when no other option exists, the dataset is
        approved, the PII fields are listed, and it is deleted on a defined date.
      '2': Datasets carry a documented lineage (source system, extraction date, fields,
        owner, retention); masking or synthetic substitution is the default and is
        reviewed before use; disposal is logged with date and method.
      '3': Synthetic data or statistically valid masking is generated by an automated
        pipeline tied to production schemas; data-flow tooling blocks unmasked PII
        leaving production; every test/training/research dataset has a registered
        owner, an expiry that triggers automatic purge, and an audit trail that can
        answer 'did this environment ever contain real PII?'
    basis: inferred
  evidence:
    value: Dataset inventory and lineage records, masking/synthesis procedures, approvals
      for any production data used, retention schedules and disposal logs, technical
      controls preventing unmasked PII from leaving production, sample dataset inspection.
    basis: inferred
  common_myth:
    value: Treating 'we mask the obvious fields like name and SSN' as sufficient -
      because quasi-identifiers (combinations of age, ZIP, gender, timestamps, device
      IDs) still re-identify people, and free-text fields like support notes carry
      PII no one scrubbed.
    basis: inferred
  auditor_asks:
    value:
    - Show me the lineage record for the training dataset used in your last model
      build - what production tables fed it, and what masking was applied to free-text
      fields?
    - Pick any non-production environment from your inventory and prove whether real
      PII has ever lived there.
    - How does an unmasked PII record get blocked from being written into a test or
      training store today?
    basis: inferred
  regional_note:
    value: EU auditors under GDPR treat any reuse of production personal data in test/training
      as a separate processing purpose requiring its own lawful basis and often DPIA
      evidence; US auditors (HIPAA, state breach laws) focus more on whether a breach
      of a test system would trigger notification. The control objective is the same
      but EU reviews of this control tend to go deeper into the legal basis for the
      secondary use.
    basis: inferred

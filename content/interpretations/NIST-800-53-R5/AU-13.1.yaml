control_id: NIST-800-53-R5:AU-13.1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Defends against the failure mode where monitoring only catches what a human
      happens to look at — automated tools exist precisely because attackers move
      faster than manual review, and audit data without machine-assisted correlation
      becomes a forensic graveyard rather than a detection mechanism.
    basis: inferred
  plain_zh:
    value: Make sure your audit logging and review actually use automated tools to
      find anomalies, correlate events, and flag suspicious behavior — not just collect
      logs and hope someone reads them.
    basis: inferred
  practice:
    value:
      '1': At least one automated tool (SIEM, log correlation, anomaly detection)
        ingests logs from critical systems and produces alerts on defined signatures.
      '2': Tools cover correlation across sources (identity, network, endpoint); rules
        and thresholds are documented and reviewed; analysts have playbooks for the
        alerts generated.
      '3': Detection content is tuned against real environment telemetry, false positives
        are tracked and reduced, coverage gaps are known and accepted, and the automation
        demonstrably shortened time-to-detect compared to manual review.
    basis: inferred
  evidence:
    value: Tool inventory and coverage map (which log sources are ingested vs. missing),
      rule/analytic library with ownership and last-tuned date, sample alerts with
      investigation outcomes, metrics on time-to-detect and false-positive rates.
    basis: inferred
  common_myth:
    value: Buying a SIEM license and pointing it at syslog counts as 'using automated
      tools'. A SIEM with default vendor rules and no tuning, no ownership of alerts,
      and no closed-loop on false positives is just a more expensive log archive —
      the automation is not actually working.
    basis: inferred
  auditor_asks:
    value:
    - Which of your audit-log sources are not ingested by any automated tool, and
      why?
    - Show me a detection rule you wrote or tuned in the last year and what false-positive
      rate you track for it.
    basis: inferred
  regional_note:
    value: null
    basis: inferred

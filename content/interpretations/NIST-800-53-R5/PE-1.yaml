control_id: NIST-800-53-R5:PE-1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Prevents physical security from drifting into ad-hoc practices, undocumented
      local rules, or vendor defaults - without a written, approved, and maintained
      policy and procedure, staff improvise and there is nothing to hold them (or
      the program) accountable to during an incident or audit.
    basis: inferred
  plain_zh:
    value: Write down who is responsible for physical and environmental protection,
      what the rules are, how they are carried out, and keep the documents current
      and approved.
    basis: inferred
  practice:
    value:
      '1': A single document or short set covers physical and environmental protection
        policy and procedure; it is signed by a designated official and shared with
        the people who enforce it.
      '2': Policy and procedure are kept separate from technical configs, reviewed
        on a fixed cadence, and any local site rules reference the central document
        so they cannot drift out of scope.
      '3': Reviews are triggered by concrete events (incident, facility change, new
        asset class); versions, approval dates and dissemination logs are retained;
        the policy drives measurable controls rather than restating them.
    basis: inferred
  evidence:
    value: Signed policy and procedure documents, version history with approval dates,
      dissemination or training records, evidence of review and updates after relevant
      changes.
    basis: inferred
  common_myth:
    value: Treating the policy as a boilerplate template pasted into a GRC tool and
      forgetting it. A policy that no one has read, that has no owner, or that was
      last touched years ago does not satisfy the control even if the document exists.
    basis: inferred
  auditor_asks:
    value:
    - Who owns the physical and environmental protection policy and when was it last
      approved?
    - Show me the last review and what triggered it.
    basis: inferred
  regional_note:
    value: null
    basis: inferred

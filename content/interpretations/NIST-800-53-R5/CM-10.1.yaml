control_id: NIST-800-53-R5:CM-10.1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Prevent unmanaged open-source components from quietly entering the codebase
      and creating license-compliance, support, and supply-chain risk that nobody
      notices until a legal letter, a public CVE, or an audit forces the issue.
    basis: inferred
  plain_zh:
    value: Track which open-source software your systems actually use, control what
      gets added, and keep that picture accurate over time so license obligations,
      known vulnerabilities, and unsupported components don't quietly accumulate.
    basis: inferred
  practice:
    value:
      '1': Maintain a written list of approved open-source components and licenses;
        require developer sign-off before adding a new one; keep installation evidence
        per system.
      '2': Use software composition / dependency scanning on builds to detect introduced
        components and licenses; record exceptions and approvals; track components
        no longer maintained by upstream.
      '3': Ingest scan results into a vetted inventory tied to SBOMs; block or gate
        builds that pull in unapproved licenses; trigger review when a CVE or license
        change affects something in use; the inventory survives turnover.
    basis: inferred
  evidence:
    value: Approved open-source list, license terms in use, scan reports and SBOMs,
      exception register, evidence that scans actually ran against current builds,
      change records when components are added or removed.
    basis: inferred
  common_myth:
    value: Assuming a license-click-through on a developer laptop constitutes control
      — the risk is what already shipped into production and what will ship next build,
      not what an individual agreed to once.
    basis: inferred
  auditor_asks:
    value:
    - Show me the inventory of open-source components currently running in production
      and how it was produced.
    - When a developer adds a new dependency, what stops it from entering a release
      if its license is incompatible?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-800-53-R5:CP-3.1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Defends against contingency plans that look fine on paper because they
      were never exercised under pressure — when a real outage or disaster hits, the
      team discovers missing contacts, broken handoffs, and procedures that nobody
      can actually follow. A plan you have not rehearsed is a guess about your own
      response.
    basis: inferred
  plain_zh:
    value: Test the contingency plan by simulating disruptions, not just by reading
      it. Walk through enough of the scenarios so that people know their roles, the
      contacts work, and gaps show up before a real incident forces the issue.
    basis: inferred
  practice:
    value:
      '1': Run a basic tabletop with the core team at least once a year, using a plausible
        disruption scenario; capture who was involved, what broke, and who owns the
        fix.
      '2': Simulate a broader set of scenarios (site loss, key system failure, supplier
        outage, ransomware), include cross-team and external coordination, and track
        corrective actions to closure with evidence.
      '3': Calibrate simulation difficulty and realism against real incidents and
        threat intel; combine tabletop with technical failover or system-level exercises;
        feed findings into plan updates, training, and the risk register.
    basis: inferred
  evidence:
    value: Documented simulation scenarios, dated attendance, facilitator notes or
      recordings, identified gaps and weaknesses, corrective action tickets with owners
      and closure dates, and the updated plan sections that reflect lessons learned.
    basis: inferred
  common_myth:
    value: Treating a walk-through where the team reads the plan aloud as a valid
      test — reading the document proves only that the document exists, not that the
      organization can execute it under stress.
    basis: inferred
  auditor_asks:
    value:
    - 'Show me the last simulation you ran: scenario, who participated, what failed,
      and what you changed in the plan because of it.'
    - How do you decide which scenarios to simulate, and how often does each system
      get exercised?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

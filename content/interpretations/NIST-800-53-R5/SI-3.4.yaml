control_id: NIST-800-53-R5:SI-3.4
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Prevents malware-concealing control changes by ensuring only trusted, accountable
      operators can push malicious code updates to the protection mechanism itself
      — otherwise an attacker can simply turn the scanner off or feed it clean samples.
    basis: inferred
  plain_zh:
    value: Make sure only privileged, accountable operators can install or update
      the malicious-code protection software and its signatures, and that the system
      blocks anyone else from doing it.
    basis: inferred
  practice:
    value:
      '1': Restrict update permissions on EDR/AV consoles and signature sources to
        a named admin group; non-admins cannot push or modify.
      '2': Updates go through a documented change/approval flow with initiator, approver,
        and timestamp recorded; logs retained.
      '3': Update actions are enforced by the tool itself (role-based access, signed
        packages), with alerting and periodic review of who actually performed the
        update.
    basis: inferred
  evidence:
    value: Role/permission configuration on the protection tool, change tickets or
      approvals for signature and engine updates, audit logs of update actions, review
      records showing only privileged accounts performed them.
    basis: inferred
  common_myth:
    value: Assuming that because the AV/EDR is centrally managed, the control is satisfied
      — admins can still install unsigned or unreviewed updates locally, or the management
      server's own credentials are shared across many people, so 'privileged' is not
      actually narrow.
    basis: inferred
  auditor_asks:
    value:
    - Show me the list of accounts permitted to push signature or engine updates,
      and the log of the last ten updates performed.
    - Can a standard domain user install or modify the protection client on their
      endpoint without going through this process?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-800-53-R5:PS-6.3
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Protect the organization from security exposure that persists after employment
      ends, including forgotten accounts, unrecovered assets, unreturned records,
      lingering physical access, and duties that remain assigned to a former employee.
    basis: inferred
  plain_zh:
    value: When employment ends, promptly disable access, recover organizational property,
      close obligations, and verify that the person can no longer reach systems, facilities,
      information, or privileged responsibilities.
    basis: inferred
  practice:
    value:
      '1': Maintain a termination procedure that identifies required actions, responsible
        owners, and completion deadlines; disable access and recover assigned devices,
        badges, records, and other property.
      '2': Coordinate termination actions across HR, managers, security, facilities,
        and IT; record access removals, asset recovery, debriefing, and any retained
        access approved by an appropriate authority.
      '3': Use automated identity and asset workflows where possible, verify completion
        independently, escalate overdue or failed actions, and test the process with
        departures involving remote workers, contractors, and privileged users.
    basis: inferred
  evidence:
    value: A current post-employment procedure, completed termination checklists or
      case records, identity-system removal logs, asset-recovery records, access-badge
      deactivation evidence, and records of approved exceptions or follow-up actions.
    basis: inferred
  common_myth:
    value: Assuming account deletion alone closes the employment relationship, while
      shared credentials, cloud sessions, physical badges, devices, and privileged
      responsibilities remain active.
    basis: inferred
  auditor_asks:
    value:
    - Show the records for a recent termination, including the time access was disabled
      and the time the final checklist was completed.
    - Which organizational assets and access paths were not recovered or deactivated,
      and what follow-up action was taken?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

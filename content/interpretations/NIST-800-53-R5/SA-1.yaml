control_id: NIST-800-53-R5:SA-1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 'Defends against a security system engineering and development policy that
      exists only as folklore, a forgotten SharePoint page, or a one-time memo from
      years ago. Without an authored, approved, disseminated and maintained policy
      and procedure set for SA, every other control in the family drifts: who owns
      SDLC security, how deviations get raised, when assessments happen, and how exceptions
      expire all become tribal knowledge that leaves with whoever happens to be on
      the team.'
    basis: inferred
  plain_zh:
    value: Write down, approve, publish, and maintain a documented policy and supporting
      procedures for system and services acquisition / system development life cycle
      security, so that the rules of the road are knowable, current, and enforced
      rather than improvised.
    basis: inferred
  practice:
    value:
      '1': A policy document for the SA family exists, names an owner, is dated, and
        covers secure development, acquisition, and external system services at a
        high level.
      '2': Procedures exist for the recurring activities (secure coding standards,
        acquisition reviews, developer training, assessment before deployment); owners
        and review cadence are stated; the set has been acknowledged by engineering
        and procurement leads.
      '3': Policy and procedures carry a defined review cycle with evidence of actual
        updates, tie into the broader organizational policy hierarchy, and deviations
        or exceptions are logged and time-bound; staff can find the current version
        faster than they can find a coworker who 'knows the answer.'
    basis: inferred
  evidence:
    value: Approved SA policy and procedure documents with version history, owner
      and review cadence, dissemination records (acknowledgements or training attendance),
      and evidence of at least one review/update cycle.
    basis: inferred
  common_myth:
    value: Treating SA-1 as administrative filler satisfied by inheriting an enterprise-wide
      'Information Security Policy' that never mentions SDLC, acquisition, or developer
      practices. The control specifically expects SA-family content; a generic umbrella
      policy without SA procedures does not meet it.
    basis: inferred
  auditor_asks:
    value:
    - Show me the current SA policy and procedures and tell me when they were last
      reviewed.
    - How do engineers and procurement staff know these exist, and where do they go
      when they need the current version?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

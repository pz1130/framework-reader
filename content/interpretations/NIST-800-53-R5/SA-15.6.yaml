control_id: NIST-800-53-R5:SA-15.6
locale: zh-CN
state: confirmed
fields:
  intent:
    value: It defends against a development process that 'passed' once and then quietly
      rots — secure engineering practices are assumed effective forever, so vulnerabilities
      and weaknesses accumulate between major reworks until a breach exposes years
      of decay.
    basis: inferred
  plain_zh:
    value: Require the organization to keep measuring how well its secure development
      process actually works and to feed the findings back into process changes, on
      a recurring basis — not as a one-off certification.
    basis: inferred
  practice:
    value:
      '1': Metrics exist for the SDLC (e.g., defect escape rate, review coverage,
        mean time to remediate) and are reviewed when something obvious goes wrong.
      '2': A documented, recurring improvement cycle (e.g., quarterly retrospective)
        reviews secure-dev metrics, root-cause analyses from incidents and pentests,
        and assigns owners to corrective actions with dates.
      '3': Improvement actions are tracked to closure, trends visible to engineering
        leadership, security gates (threat models, code review, SAST/DAST) are tuned
        from the data, and the cycle influences tooling, training, and standards revisions.
    basis: inferred
  evidence:
    value: Recurring improvement-meeting minutes, secure-SDLC metrics dashboards,
      root-cause analyses tied to process changes, action trackers with closure evidence,
      and version history of secure-dev standards showing revisions driven by measurement.
    basis: inferred
  common_myth:
    value: Treating an initial SDL assessment or a single pentest remediation cycle
      as proof of 'continuous improvement' — once the report is closed, the process
      is assumed mature and untouched until the next audit.
    basis: inferred
  auditor_asks:
    value:
    - Show me the last three times your secure-dev metrics caused an actual change
      to process, tooling, or standards.
    - Who owns each improvement action, and how do you know it was completed rather
      than just logged?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

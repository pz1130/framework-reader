control_id: NIST-800-53-R5:AU-13.2
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Prevents organizations from treating all monitored locations as equally
      trustworthy, leaving high-value or exposed activities invisible and allowing
      misuse or compromise to persist without detection.
    basis: inferred
  plain_zh:
    value: Identify which facilities, systems, locations, or network points need monitoring,
      justify the coverage, and review the decision as risks and operations change.
    basis: inferred
  practice:
    value:
      '1': Create a list of sites or monitoring locations that are important because
        of the assets, users, activities, or threats they cover, and document why
        each should be monitored.
      '2': Apply a documented risk-based selection and review process, retain records
        of decisions and gaps, and reassess coverage after changes to facilities,
        systems, operations, or threat exposure.
      '3': Integrate monitored-site selection into the risk-management and audit-review
        cycle, periodically test whether each location provides useful and sufficient
        coverage, and retire or redesign locations that no longer support the monitoring
        objective.
    basis: inferred
  evidence:
    value: A monitored-site inventory, documented selection criteria and risk rationale,
      review and approval records, changes to the monitoring plan, and evidence that
      coverage gaps or obsolete locations were addressed.
    basis: inferred
  common_myth:
    value: Assuming that a list of monitored locations is sufficient even when critical
      facilities or systems are absent, undocumented, or no longer useful.
    basis: inferred
  auditor_asks:
    value:
    - Which sites or monitoring locations were added or removed during the last review,
      and what risks drove those decisions?
    - What process confirms that the most important facilities, systems, and activities
      are covered by monitoring?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-800-53-R5:CP-2.3
locale: zh-CN
state: confirmed
fields:
  intent:
    value: This control guards against the assumption that a continuity plan is complete
      once written. The real risk is that the organization cannot actually resume
      mission and business functions within the required timeframes, because it never
      validated the plan against real recovery steps, dependencies, and resources.
    basis: inferred
  plain_zh:
    value: It requires you to actually exercise the continuity plan to confirm that
      your organization can resume essential functions within the timeframes management
      has committed to. It's not enough to have a plan document; you must prove it
      works.
    basis: inferred
  practice:
    value:
      '1': Identify the mission and business functions that must be resumed first
        (for example, those tied to legal, contractual, or customer obligations).
        For each, document the target resume time and the people, systems, data, and
        facilities needed.
      '2': Develop and run a tabletop or desktop exercise that walks through the continuity
        plan for each essential function. Log the results, including what worked,
        what failed, and corrective actions. Run at least one exercise per year.
      '3': Perform a full operational or functional exercise that actually resumes
        real systems or processes for critical functions. Use a controlled simulation
        to validate dependencies (such as power, connectivity, backup access). Track
        every gap and re-test after fixes. Measure recovery times against targets
        and report trends to leadership.
    basis: inferred
  evidence:
    value: Recovery objective list with named functions and time targets, annual exercise
      calendar, tabletop and functional exercise agendas, facilitator notes, after-action
      reports with corrective action and due dates, and a re-test record showing closure.
    basis: inferred
  common_myth:
    value: Assuming that having a continuity plan 'organized by department' with a
      recovery-time objective column is sufficient. Without an actual exercise that
      simulates a real disruption and traces dependencies, the plan is just documentation;
      the first exercise will almost always expose missing steps, wrong contact information,
      or unreachable backups.
    basis: inferred
  auditor_asks:
    value:
    - Show me the exercise report for the last time you actually resumed a system
      or process from the continuity plan. What was not exercised?
    - How did you calculate the target resume time for customer service, and how did
      you verify the team can physically access the alternate facility or cloud region
      within that time?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-800-53-R5:CM-9.1
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Preventing configuration management from being everyone's job and therefore
      no one's job — without a named owner, baselines drift, deviations go unreviewed,
      and audit findings have no accountable party to push remediation to.
    basis: inferred
  plain_zh:
    value: Designate who is responsible for the configuration management program,
      put that designation in writing, and make sure the named party has the authority
      and resources to actually enforce baselines and approve changes.
    basis: inferred
  practice:
    value:
      '1': Someone is named (in a memo, org chart, or policy) as the configuration
        management owner; the appointment is signed by a manager with standing.
      '2': The owner's duties, authority, and escalation path are written down; the
        role is referenced in change, baseline, and exception processes so deviations
        route to them.
      '3': The owner produces periodic reporting on baseline coverage and exception
        trends, has a documented succession plan, and is resourced to enforce deviations
        are corrected or formally accepted.
    basis: inferred
  evidence:
    value: Signed designation letter or policy section naming the CM responsible role,
      the role description with duties and authority, governance records showing deviations
      and exceptions routed to and decided by that role.
    basis: inferred
  common_myth:
    value: Assuming that because IT and Security both 'touch' configuration, responsibility
      is implicitly shared and does not need to be assigned. Shared without designation
      means no one is accountable when a baseline is missing or a deviation is open
      for months.
    basis: inferred
  auditor_asks:
    value:
    - Who is the named individual or role responsible for the configuration management
      program, and where is that designation recorded?
    - Show me a recent configuration deviation or exception and how it was routed
      to that responsible party for decision.
    basis: inferred
  regional_note:
    value: null
    basis: inferred

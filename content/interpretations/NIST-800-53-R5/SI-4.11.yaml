control_id: NIST-800-53-R5:SI-4.11
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Prevents the failure where a perimeter looks 'clean' only because the sensors
      never look at the traffic itself — encrypted or obfuscated flows, beacons hidden
      inside allowed protocols, and slow-drip exfiltration go unflagged because the
      monitoring stack only matches signatures, not behavior.
    basis: inferred
  plain_zh:
    value: Outbound and inbound communications traffic is inspected not just for known
      bad signatures but for behavioral anomalies — unusual volumes, timing, destinations,
      protocol misuse, covert channels — and the results feed detection and response.
    basis: inferred
  practice:
    value:
      '1': Network monitoring exists at key egress points and at least reviews flows
        for obvious anomalies (unexpected destination countries, large off-hours transfers).
      '2': Defined anomaly scenarios are documented (beaconing, DNS tunneling, unusual
        protocol use, data staging) and reviewed on a schedule; findings are ticketed
        and investigated.
      '3': Anomaly detection is continuous, tied into the incident response workflow
        with defined thresholds and escalation, and tuned against current threat intel;
        analysts can show how a recent finding was generated, escalated, and resolved.
    basis: inferred
  evidence:
    value: Network sensor coverage map, documented anomaly use-cases and thresholds,
      tuning and detection rule history, sample alert-to-incident tickets showing
      investigation and closure.
    basis: inferred
  common_myth:
    value: Believing that running an IDS/IPS or a NDR appliance automatically satisfies
      the control — the device is deployed but its anomaly analytics are disabled,
      never tuned, or generate alerts that nobody in the SOC actually opens.
    basis: inferred
  auditor_asks:
    value:
    - Show me a recent anomaly alert raised by traffic analysis, how it was triaged,
      and what the outcome was.
    - Which egress paths are not covered by your anomaly monitoring, and why are they
      excluded?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

control_id: NIST-800-53-R5:SC-30.4
locale: zh-CN
state: confirmed
fields:
  intent:
    value: Defends against attackers steering detection, response, or analysis into
      dead ends by manipulating the information defenders rely on (logs, telemetry,
      configuration state, decoy placement). If you do not inject controlled misleading
      artifacts, adversaries can shape your own sensors against you and your team
      will chase ghosts while the real action happens elsewhere.
    basis: inferred
  plain_zh:
    value: Plant deliberately misleading information into the systems and data an
      attacker is likely to read, so their decisions, tooling, or tradecraft work
      against them or against your detection team's advantage.
    basis: inferred
  practice:
    value:
      '1': Identify a few high-value assets and decide what decoys, breadcrumbs, or
        false configuration values you will expose (e.g. fake credentials, fake shares,
        fake admin hosts); document the intent and owner.
      '2': Place the misleading artifacts, feed any interaction with them into monitoring
        and alerting, and keep an internal record of what is real versus planted so
        responders do not get fooled themselves.
      '3': Tie the misleading-information layer into threat models and red-team exercises,
        refresh artifacts as the environment changes, and measure whether planted
        items are being touched and whether the alerts they generate lead to faster
        or more accurate response.
    basis: inferred
  evidence:
    value: A documented scheme of what misleading information is deployed where, why,
      and who owns it; monitoring and ticket history showing how touches on planted
      items were detected and handled; separation between planted and real data so
      responders do not misclassify.
    basis: inferred
  common_myth:
    value: Treating honeypots and breadcrumbs as a pure detection silver bullet and
      assuming buying a deception platform satisfies the control — the deception only
      works if its triggers are wired into alerting, its placement is informed by
      the threat model, and the real environment is scrubbed of accidental leaks that
      would expose the deception as fake.
    basis: inferred
  auditor_asks:
    value:
    - Which systems or data are you deliberately misleading, and what decision by
      the attacker are you trying to influence?
    - Show me the last alert generated by something touching a planted artifact and
      how it was handled.
    - How do responders tell a planted credential or host apart from a real one during
      an incident?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

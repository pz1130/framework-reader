control_id: ISO-27002-2022:A.7.8
locale: en
state: draft
fields:
  intent:
    value: The concern is that equipment may be placed in locations without due consideration of physical
      threats or environmental limits—fire, water leakage, power outage, vibration, temperature/humidity
      extremes, or electromagnetic leakage—any of which could damage equipment or cause data leakage first,
      while decision-makers in server rooms and security offices fail to treat these as constraints.
    basis: inferred
  plain_zh:
    value: The placement of core assets such as servers, network devices, and security equipment, along
      with environmental controls and fire suppression/water protection measures, should be based on risk
      assessment rather than renovation habits; also prevent equipment location itself from becoming a
      channel for information leakage—for example, screens facing windows, electromagnetic radiation being
      intercepted, or maintenance access points facing public areas.
    basis: inferred
  practice:
    value:
      '1': Server rooms and telecommunications rooms have fire extinguishers and smoke detectors; temperature
        and humidity are supported by air conditioning; basic water protection measures are in place at
        leakage risk points (e.g., air conditioning drainage, areas above water pipes); equipment is not
        placed directly beneath pedestrian walkways.
      '2': Critical server rooms use independently powered smoke detection and fire suppression systems,
        not just handheld extinguishers; temperature and humidity have real-time monitoring and alarms;
        the locations of main water valves and isolation valves are indicated on diagrams, labeled, and
        known to designated personnel; equipment deployment locations are documented and have undergone
        multi-hazard risk reviews.
      '3': Fire detection and suppression systems have independent power supplies and are regularly tested
        in conjunction, not just during annual inspections; environmental monitoring is integrated into
        duty alarms, with thresholds set according to equipment manufacturer specifications rather than
        arbitrarily; maps of critical areas, valve locations, and power-down sequences have been practically
        drilled with security and operations staff; electromagnetic leakage is measured or shielded, not
        assumed to be absent.
    basis: inferred
  evidence:
    value: Design drawings of server rooms/telecommunications rooms and equipment deployment diagrams,
      annual inspection and joint testing reports of fire suppression systems, alarm records and threshold
      configuration screenshots of temperature/humidity monitoring systems, diagrams of main water valve/isolation
      valve locations with patrol signatures, risk review forms for new equipment site selection, and
      electromagnetic leakage assessment reports (if conducted).
    basis: inferred
  common_myth:
    value: It is mistakenly believed that this requirement simply means 'placing equipment in a server
      room with fire extinguishers and air conditioning'—but auditors first check whether equipment placement
      has undergone documented risk assessment, then examine whether fire protection and water valves
      have independent power supplies and joint testing, and finally scrutinize whether environmental
      monitoring thresholds are set according to equipment specifications, rather than merely submitting
      photos of fire extinguishers and thermometers.
    basis: inferred
  auditor_asks:
    value:
    - Is the fire protection system in the server room connected to the main power supply or independently
      powered? When was the last joint test, and where is the report?
    - Are there water pipes directly above the equipment racks? If so, where are the isolation valves,
      who is responsible for closing them, and have drills been conducted?
    - Who set the temperature and humidity alarm thresholds? Were they based on equipment manufacturer
      specifications or arbitrarily assigned?
    basis: inferred
  regional_note:
    value: European auditors generally impose stricter requirements for this control, especially in data
      center scenarios—they often reference the EN 50600 series' graded requirements for physical security
      and environmental classification to verify that your protection level matches the asset classification;
      American auditors focus more on independent power supply for fire protection systems and alignment
      with NFPA standards. If you can ensure that the protection level is linked to asset classification
      and can explain this, you will pass in both regions.
    basis: inferred

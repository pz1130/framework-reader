control_id: ISO-27002-2022:A.7.14
locale: en
state: draft
fields:
  intent:
    value: The concern is about 'residual data in old devices not being properly cleaned'—when devices
      are scrapped, donated, returned for repair, or replaced, residual data on hard drives, phones, printers,
      and copiers can be retrieved and removed, leading to data leakage.
    basis: inferred
  plain_zh:
    value: For any device or media that will leave your control, first clean the data as required to make
      it unrecoverable; the cleaning intensity should match the sensitivity of the data stored on it.
    basis: inferred
  practice:
    value:
      '1': Maintain a device disposal/transfer registration form; before disposal, someone is responsible
        for clearing or physically destroying storage media, with records and signatures.
      '2': 'Handle disposal based on data sensitivity: ordinary data can be cleared and overwritten, while
        sensitive data requires professional tools for multiple overwrites or physical destruction; disposal
        has a ledger and a reviewer.'
      '3': 'Integrate the disposal process with the asset ledger: automatically trigger a cleaning work
        order before each device is scrapped, write back the disposal results, and periodically sample-check
        whether physical destruction is truly effective; similar cleaning processes exist for cloud virtualized
        and storage resources.'
    basis: inferred
  evidence:
    value: Disposal/transfer registration form (device ID, disposal method, operator, reviewer, date),
      records or reports from wiping or destruction tools, asset ledger status updates, sample photos,
      or recycling certificates from destruction service providers.
    basis: inferred
  common_myth:
    value: Assuming that 'formatting the hard drive or deleting files' counts as cleaning. After a normal
      format, professional tools can still recover data; sensitive devices must be wiped multiple times
      with professional tools or physically shredded, and there must be verifiable records—not just a
      verbal claim of cleaning.
    basis: inferred
  auditor_asks:
    value:
    - When this printer is scrapped, how do you handle the cached data on it? Where are the records?
    - When an employee leaves and their work computer is transferred to the next person, who is responsible
      for cleaning it, what tools are used, and how is it proven that it was cleaned?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

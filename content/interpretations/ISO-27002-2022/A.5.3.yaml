control_id: ISO-27002-2022:A.5.3
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「一个人从头到尾把一个关键流程做完」——从授权、执行到复核都在同一人手里，既有权限凌驾于监督之上，出问题时没有任何人发现或拦住，内部作案或单点失误无人能纠。
    basis: inferred
  plain_zh:
    value: 把敏感业务或技术流程拆成多段，让不同的人分别承担关键步骤，并把这个拆分写成制度、落到系统权限上——不是靠自觉，而是靠系统不允许同一个人走过全程。
    basis: inferred
  practice:
    value:
      '1': 识别出财务付款、账号授权、系统管理员等高风险岗位；凭据明确规定这些岗位必须拆分，关键操作需要双人复核。
      '2': 为拆分后每段职责明确到具体角色和系统权限；职责分离冲突的解除要书面审批留痕，并做周期性复核确认配置未绕开。
      '3': 访问控制管理系统强制匹配职责分离矩阵，发现冲突即自动阻断或告警；权限与审计日志分离管理；冲突案例有定期复盘并触发矩阵更新。
    basis: inferred
  evidence:
    value: 职责分离矩阵或岗位职责说明、冲突审批与豁免记录、系统权限与角色映射表、权限评审纪要、审计日志中关键操作的双人记录或系统强制阻断告警。
    basis: inferred
  common_myth:
    value: 以为「订了制度说采购和付款由不同人管」就结束了。现实中不少人同时持有两套权限，或虽然名义上分岗，但复核人只看结果不看单据——审计抽查到具体个案马上露馅。制度是起点，系统权限和实际执行是否一致才是关键。
    basis: inferred
  auditor_asks:
    value:
    - 这位主管为什么同时有系统管理员权和审计日志查看权？豁免写在哪个流程、谁批的？
    - 抽一笔金额最高的付款，从发起、审批到支付，每一个节点分别是谁、各自用的什么账号？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

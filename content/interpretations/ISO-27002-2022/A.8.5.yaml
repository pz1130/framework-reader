control_id: ISO-27002-2022:A.8.5
locale: en
state: draft
fields:
  intent:
    value: The concern is to prevent credentials from remaining usable after credential stuffing, brute
      force attacks, or shoulder surfing—the login gateway must be able to block continuous attempts,
      lock accounts according to policy, avoid leaking sensitive information on the screen, and show users
      their last login record upon login so that they can detect unauthorized use of their accounts at
      the earliest opportunity.
    basis: inferred
  plain_zh:
    value: 'Manage the login entry point strictly: consecutive incorrect entries should trigger lockout
      or delay, and the lock should be automatically released; before login, a warning statement should
      pop up on the screen; after login, the user should be informed of the last login time; password
      entry must not be displayed in plaintext but masked.'
    basis: inferred
  practice:
    value:
      '1': There is a limit on the number of failed login attempts, exceeding which triggers a short-term
        lockout or delay; the password input field is masked; the login page includes a warning statement;
        after login, the time and date of the last login are shown.
      '2': Lockout policies are configured by scenario (e.g., different for intranet, VPN, bastion hosts,
        and operations backends); both automatic unlock and manual unlock processes exist; the warning
        banner requires explicit user click to continue; logs are available for failed attempts, lockout
        duration, and unlock records.
      '3': Anomalous login behaviors (e.g., targeted brute force, credential stuffing) are detected and
        alerted, with the ability to trigger blocking; the risk of username enumeration has been assessed
        and mitigated; password input echo policy is weighed separately for mobile and desktop; the last
        login information is mandatorily displayed on the user side and cannot be dismissed.
    basis: inferred
  evidence:
    value: Screenshots or exported configurations of login policy settings, logs of account lockouts and
      automatic unlocks, screenshots of the system notice banner page, screenshots or configurations of
      masked password input, and recent records of brute force detection and handling.
    basis: inferred
  common_myth:
    value: The misconception is that 'strong password complexity is sufficient'—complexity only governs
      the password itself, not persistent attempts; without failed login lockout and last login notification,
      you won't know if credential stuffing succeeds, and auditors will directly question whether this
      layer exists.
    basis: inferred
  auditor_asks:
    value:
    - How many consecutive failures trigger lockout, and for how long? On which systems does this parameter
      take effect, and which systems lack it?
    - Can users see the last login time after logging in? On which interface is it displayed? Can you
      provide a screenshot?
    - What does the password field echo look like? Is it masked or plaintext?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

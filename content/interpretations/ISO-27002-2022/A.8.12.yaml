control_id: ISO-27002-2022:A.8.12
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是数据以任何形态离开你允许的边界——无论是黑客拖库、内部人拷走、员工误发邮件，还是物理介质被带出。核心是「知道数据去哪了，并且拦得住不该走的」，而不是只在出口装个监控就算完事。
    basis: inferred
  plain_zh:
    value: 要你建立一套机制，能发现、阻止并处理数据未经授权离开公司的各种途径——包括网络出口、终端设备、物理边界和第三方渠道，而且这套机制要经过测试。
    basis: inferred
  practice:
    value:
      '1': 网络出口有基本防护（如DLP或防火墙规则）；有数据分级；能讲清敏感数据主要存在哪、通过哪些通道出去。
      '2': 有明确的数据外泄检测与响应流程；DLP策略覆盖主要通道（邮件、Web、USB）；定期做数据外泄测试/演练并有记录。
      '3': 出口与终端监控联动，异常外发能自动阻断；使用蜜标数据等主动追踪手段；外泄测试纳入常规安全评估，结果驱动策略改进。
    basis: inferred
  evidence:
    value: DLP策略与规则配置、出口流量监控日志、数据分级清单、外泄告警与处置记录、数据外泄演练测试报告、蜜标数据部署记录。
    basis: inferred
  common_myth:
    value: 以为「装了DLP产品、邮件出去要审批」就达标。DLP落不了地最常见的原因是没做数据分级——不知道哪些是敏感数据，规则就没法写准，结果要么全放行要么全拦截，审计员只要问「你的DLP重点保护哪几类数据、规则按什么写的」就露馅。
    basis: inferred
  auditor_asks:
    value:
    - 你的DLP策略按什么数据分级规则配置的？规则最近一次更新是什么时候？
    - 外泄演练最近一次是什么时候？演练发现了什么问题、改了什么？
    - 内部人员把机密文件压缩改名后经网盘上传，你的监控能发现吗？
    basis: inferred
  regional_note:
    value: 美国审计员常以NIST框架为参照，关注网络出口技术控制（SC-7.10）和检测能力；欧洲审计员在GDPR语境下更关心数据主体信息去哪了、有没有跨境传输，问题会追到「你怎么证明个人数据没有被未经授权转移出去」——比纯技术出口监控要宽。
    basis: inferred

control_id: ISO-27002-2022:A.5.21
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「买的设备、软件、云服务在链路里被人动过手脚」——从厂商研发、生产、运输到上线，哪个环节被植入后门、替换固件、掺入伪造组件，单靠到货验收根本看不出来；这条逼你从采购源头就设计管控，而不是等系统出事了才溯源。
    basis: inferred
  plain_zh:
    value: 对ICT产品和服务，从供应商的选择、合同条款、采购方式、交付验收到运行维护全链条，建立并执行一套防篡改、防伪造、可溯源的管控流程。
    basis: inferred
  practice:
    value:
      '1': 对供应商做准入审查；采购合同里写明安全要求（如禁止转包关键部件、交付物须含来源证明）；到货做外观和基本完整性检查。
      '2': 按风险分级选择采购策略（如关键系统不买二手、不买来路不明渠道）；要求供应商提供物料清单和来源证明；对交付与运输过程有记录和签收核对；对高风险部件做额外验证（如固件哈希比对）。
      '3': 建立并维护每个关键系统/组件的完整溯源档案（从厂商、批次、序列号、涉及人员到变更记录）；采购策略、工具和供应商安全要求定期评审并随威胁变化更新；对供应链安全事件有检测和响应机制，能定位到具体环节并处置。
    basis: inferred
  evidence:
    value: 供应商准入与分级记录、采购合同中的安全条款、采购策略/方法文档、物料清单及来源证明、到货验收记录与签收单、溯源档案（组件/系统级）、供应链安全事件处置记录。
    basis: inferred
  common_myth:
    value: 以为「用了知名品牌、从正规代理下单」供应链就安全。大品牌照样有地区代工差异和批次问题；关键是能不能证明自己拿到的这批货，从出厂到你手里链路没断——没有物料清单和到货核对，任何设备都可能被调包。
    basis: inferred
  auditor_asks:
    value:
    - 关键设备/软件的物料清单和来源证明存放在哪？抽查一件，链路能追溯到厂商哪条生产线？
    - 采购合同里哪一条禁止供应商把固件开发或关键部件生产转包给未经你批准的分包商？
    - 到货验收时发现封条破损或固件哈希不一致，你们的处置流程是什么？最近一次发生是什么时候？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

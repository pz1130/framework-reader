control_id: ISO-27002-2022:A.5.34
locale: en
state: draft
fields:
  intent:
    value: The concern is about treating personal data as ordinary assets—where collection, use, sharing,
      and deletion of data lack legal basis and boundary limits at each step, processing purposes are
      not documented in writing, individuals cannot learn what their data is used for, and when incidents
      occur, it is unclear why data was collected or on what basis it was processed.
    basis: inferred
  plain_zh:
    value: You must clarify the legal or business basis for collecting each category of personal information,
      what it is used for, and set boundaries accordingly—you cannot collect or use data arbitrarily.
      When purposes change, reassess them; treat sensitive categories specially; and document all this
      in auditable policies and procedures.
    basis: inferred
  practice:
    value:
      '1': Privacy policy exists; business purpose can be stated when collecting personal information;
        basic understanding of where personal data is stored and who uses it.
      '2': Document in writing the processing purpose, legal basis, and retention period for each data
        category; include processing purposes in privacy notices; purpose changes undergo approval and
        compatibility reassessment; additional classification and protection rules for sensitive data.
      '3': Systematically register processing purposes and data flows (e.g., data dictionary or privacy
        platform); monitor actual processing activities against stated purposes and block incompatible
        uses; sensitive category processing requires dual-person review or legal confirmation; automated
        safeguards for deletion or anonymization.
    basis: inferred
  evidence:
    value: Privacy policy and notices, registry of personal information processing purposes and legal
      bases, data classification list (including sensitive category markers), approval and compatibility
      assessment records for purpose changes, data flow diagrams or system inventories.
    basis: inferred
  common_myth:
    value: Assuming that 'displaying a privacy policy pop-up' constitutes compliance. The real gap lies
      internally—who collected which fields based on what, which systems data flows to after collection,
      how long it is retained, and how it is purged. Without documented purposes and approval records,
      even the most polished external privacy promises are hollow.
    basis: inferred
  auditor_asks:
    value:
    - What is the legal basis for the company's processing of personal data? List each category and the
      corresponding document.
    - Which data categories are identified as sensitive? What criteria are used? What additional approvals
      are required for processing?
    basis: inferred
  regional_note:
    value: European auditors closely scrutinize 'specified processing purposes' and 'purpose compatibility,'
      often checking purposes and retention against GDPR Article 5 item by item; in the U.S., the focus
      is on privacy notices and consumer rights responses under the FTC and state laws (e.g., CCPA/CPRA),
      with different tracking depths.
    basis: inferred

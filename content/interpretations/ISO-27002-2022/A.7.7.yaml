control_id: ISO-27002-2022:A.7.7
locale: en
state: draft
fields:
  intent:
    value: The concern is about 'leaving the screen on when walking away' and 'printed documents left
      uncollected'—passersby, cleaners, and interviewees can casually see sensitive information in the
      physical space; confidentiality is breached not through network attacks but through visual scanning.
    basis: inferred
  plain_zh:
    value: Lock or clear the screen when leaving the workstation; sensitive materials printed, faxed,
      or copied must not be left unattended; storage media containing sensitive information, such as computers
      and paper, should be properly secured and locked away, and wiped clean when disposed of or discarded.
    basis: inferred
  practice:
    value:
      '1': Computers have an automatic screen lock policy (e.g., lock after a few minutes of inactivity);
        manual screen locking when leaving the workstation is an explicit requirement; promptly retrieve
        printed sensitive documents.
      '2': Screen lock durations are tiered by area (e.g., shorter in R&D zones); sensitive printing goes
        to designated printers with area clearance checks or shredding procedures; visitor areas cannot
        see sensitive screens.
      '3': Seamless screen locking (e.g., automatic lock upon departure) is standard; sensitive document
        printing requires access control or card-based retrieval; physical media have logs from issuance,
        storage, to destruction, with certified destruction records.
    basis: inferred
  evidence:
    value: Screen lock policy configuration and distribution records, employee information security commitments
      or training attendance, printing logs and shredding records, physical media logs, destruction records
      or service provider qualifications.
    basis: inferred
  common_myth:
    value: Assuming that 'setting a screen lock duration' means this is fully addressed, but paper-based
      sensitive documents near printers or on public desks are unmanaged, and privacy screens are not
      applied—auditors examine the entire physical environment, not just computer settings.
    basis: inferred
  auditor_asks:
    value:
    - What is the automatic screen lock duration? Is it the same for R&D, customer service, and leadership?
    - Are there policy constraints or technical controls for sensitive documents not promptly retrieved
      after printing?
    - What destruction process do waste paper, discarded hard drives, and old printer toner cartridges
      follow? Where are the most recent destruction records?
    basis: inferred
  regional_note:
    value: European auditors focus more on paper media and removable media—under GDPR, someone seeing
      another person's personal data on a screen constitutes a breach; U.S. auditors emphasize screen
      lock policy configuration and physical access control, with relatively fewer inquiries about paper
      materials.
    basis: inferred

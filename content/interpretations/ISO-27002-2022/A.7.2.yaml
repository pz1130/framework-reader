control_id: ISO-27002-2022:A.7.2
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「进出没人管」——外部人员、离职人员、临时访客能混进门禁区，或设备材料被悄悄带出带入，造成失窃、篡改和数据泄露。
    basis: inferred
  plain_zh:
    value: 对人员进出办公区域和核心区域做授权和登记，访客要有人陪同，钥匙门禁卡要管好，设备物资进出要有记录。
    basis: inferred
  practice:
    value:
      '1': 有门禁或前台登记；访客登记并佩戴访客牌；离职人员门禁卡当天回收。
      '2': 进出区域分等级授权；访客全程有人陪同并有记录；钥匙/门禁卡发放台账清晰，丢失有补办流程。
      '3': 门禁系统与人员台账联动，离职或调岗权限自动失效；设备物资进出有审批和登记；门禁日志定期审计并留存。
    basis: inferred
  evidence:
    value: 门禁权限申请与变更记录、访客登记表、陪同人签名、钥匙/门禁卡发放与回收台账、设备及物资进出登记单、门禁系统日志及审计抽查记录。
    basis: inferred
  common_myth:
    value: 以为装了门禁系统、前台有登记本就算过关——真正的问题是离职人员门禁权限没及时清、访客登记后没人陪同、物资进出无人过问，审计员抽查几笔就能看出执行是空转。
    basis: inferred
  auditor_asks:
    value:
    - 抽三个离职员工，门禁权限是哪天注销的？依据哪份流程？
    - 访客进入核心机房时，陪同人的签字或记录在哪？访客可以独自离开吗？
    basis: inferred
  regional_note:
    value: 欧洲受 GDPR 影响，审计员更关注人员进出记录是否涉及个人数据、留存期限是否合规；美国更侧重门禁日志的完整性和对敏感区域的物理隔离。两边对「访客陪同」这条都较严，但欧洲会追记录本身的数据保护合规性。
    basis: inferred

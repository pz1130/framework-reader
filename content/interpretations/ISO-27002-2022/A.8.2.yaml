control_id: ISO-27002-2022:A.8.2
locale: zh-CN
state: draft
fields:
  intent:
    value: 防的是「高权限账号一旦被滥用，可以直接绕过所有下层控制」——备份、日志、EDR 这些保护在拥有管理员权限的攻击者面前全可被关闭，一个被钓鱼或内鬼拿下的域管账号，效果等同于一次全盘失守。没有对高权限使用的单点盯防，就等于把大楼钥匙放在前台抽屉里还告诉所有人。
    basis: inferred
  plain_zh:
    value: 对拥有系统级、域级或应用级最高权限的账号，要比普通账号高出一个量级地去管：得知道谁有、以什么方式用、每次使用能不能对上岗位职责，并且这些使用要能回溯、能告警、能拦截，而不是只看个权限审批单。
    basis: inferred
  practice:
    value:
      '1': 高权限账号有清单并有人负责；开通要走单独审批，不用时不挂在那里；启用过程至少留一份纸质或工单记录。
      '2': 高权限操作走堡垒机或专用跳板机统一入口，所有会话有录屏或按键日志；每周至少抽查一次是否有与工作无关的登录；离职或调岗时，高权限当天回收且留回收证明。
      '3': 高权限账号与身份无关（无固定口令或按需签发临时凭证）；所有特权行为在日志平台做关联分析与自动告警，触发条件如非工作时间登录、批量查询、新增其他高权限账号；由独立一方（如安全团队而非运维自审）做周期性特权账号使用评审，评审结论回写为权限变更动作。
    basis: inferred
  evidence:
    value: 高权限账号清单及负责人；特权账号开通/回收审批工单；堡垒机会话录像或按键审计日志；抽查某事件回溯时能把某次特权操作对应到具体人和会话的截图；特权使用评审纪要或自动化分析报告；按用户（而非仅按服务器）维度的登录与操作日志。
    basis: inferred
  common_myth:
    value: 以为「装了堡垒机」就算高权限管控完成，但从堡垒机看到的所有操作照样可以全是合法的——审计员更在意是否有人能看出「某个高权限账号在凌晨三点登录了数据库并把表删除干净」这条操作链，而不是你录了多少小时的屏。屏幕录像不停在录，但没有人看、没有规则去触发它，等于只是留了个故障现场录像机。
    basis: inferred
  auditor_asks:
    value:
    - 把所有有过域管权限的账号列出来——其中哪些在过去 90 天内实际登录过？为什么？
    - 某高权限账号上一次被使用是在什么时间、什么 IP、做了什么，你能在五分钟内拉出证据吗？
    - 你们怎么区分「这个高权限操作是某人干的」与「任何人都可以用这个共享账号干的」？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

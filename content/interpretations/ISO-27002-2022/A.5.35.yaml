control_id: ISO-27002-2022:A.5.35
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「自己查自己、自己给自己盖章」的失效闭环——安全团队同时是系统开发者和效果评判者时，审计结论天然失真。这条逼你引入无利害关系的外部视角，否则控制有效性永远是自我感觉良好。
    basis: inferred
  plain_zh:
    value: 让你请与所审计系统没有利益关系的人或团队来做控制评估，保证评价结论不偏不倚。评估者不能是系统开发方、运维方，也不能是自己评自己。
    basis: inferred
  practice:
    value:
      '1': 由未直接参与系统开发与运维的人员开展安全评估；评估人签字声明无利益冲突。
      '2': 书面规定独立评估者的选择标准与回避要求；至少每年或重大变更后由非开发团队执行评估；评估范围、方法与结论有正式报告。
      '3': 分离评估与整改的责任方，评估结果直接上报治理层；年度评估由外部第三方或独立内审执行；评估者独立性定期验证，纳入供应商与外包管理。
    basis: inferred
  evidence:
    value: 独立评估人员名单及其利益冲突声明、独立评估报告（含范围、方法、结论）、评估者组织归属与所评估系统的关系说明、年度或变更驱动的评估计划。
    basis: inferred
  common_myth:
    value: 以为「安全组的人换个项目组做检查」就算独立。只要评估者与被评估团队有绩效或汇报从属关系，结论依旧可被施压——独立性要看组织边界和汇报线，不看名字。
    basis: inferred
  auditor_asks:
    value:
    - 去年这次评估的执行人，是否直接汇报给被评估系统的主管？依据在哪？
    - 如果评估中发现开发方系统性缺陷，评估组有什么权力和责任确保记录不被压掉？
    basis: inferred
  regional_note:
    value: 欧洲受监管行业（如金融、医疗）在重要 ICT 系统的控制评估上明显要求第三方独立组织参与，且不能是原厂商或长期驻场顾问；美国在内部审计职能强时的组织内独立性边界更宽泛，但仍禁止自评。
    basis: inferred

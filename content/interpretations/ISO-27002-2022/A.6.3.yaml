control_id: ISO-27002-2022:A.6.3
locale: en
state: draft
fields:
  intent:
    value: The concern is about "training done for show, forgotten after completion" — personnel security
      awareness not translating into behavioral change and skill retention. Risks related to people, such
      as phishing, misoperations, insider collusion, and panic during emergencies, cannot be masked by
      routine training records.
    basis: inferred
  plain_zh:
    value: It's not just about taking a course and an exam once a year. Training content should be differentiated
      by role, so everyone knows what they need to master and who to contact in an incident. Use real
      events and cases for repeated reinforcement, ensuring knowledge and skills truly take root in employees,
      not just in training records.
    basis: inferred
  practice:
    value:
      '1': New employees receive security awareness training upon onboarding; key roles (operations, development,
        customer service) receive basic role-specific skills training; training records include sign-in
        sheets and exam scores.
      '2': Differentiated training plans are designed based on role-specific risks; training content is
        regularly updated based on real incidents and phishing drill results; clear retraining triggers
        exist (e.g., role changes, major system overhauls); records are traceable to individuals.
      '3': Training effectiveness is driven by metrics (e.g., simulated phishing click rates) rather than
        attendance rates; emergency response, drills, and training form a closed loop, with lessons from
        real incident reviews feeding back into course content; equivalent requirements cover outsourced
        and third-party personnel.
    basis: inferred
  evidence:
    value: Annual training plans, role-specific course outlines and sign-in sheets, training assessment
      records, phishing drill results and analysis reports, retraining trigger and execution records,
      training satisfaction and knowledge test data.
    basis: inferred
  common_myth:
    value: Assuming that "a unified annual video and exam for all staff" constitutes compliance. Role-based
      differentiation, content updates aligned with threat evolution, and evidence proving training effectiveness
      are the real acceptance criteria — a unified exam cannot cover key roles such as emergency command,
      development security, and supplier personnel.
    basis: inferred
  auditor_asks:
    value:
    - What was the click rate in last year's phishing drill? How does this compare to the previous year,
      and what are the reasons?
    - What training did newly hired outsourced operations personnel receive before starting? How is their
      learning verified?
    - Which role's training is conducted only once a year with unchanged content?
    basis: inferred
  regional_note:
    value: In Europe, due to linkage with regulations like GDPR, there is greater emphasis on comprehensive
      awareness training including privacy protection; in the US, under a compliance-oriented approach,
      there is more focus on role-based implementation and auditable records. Differences mainly lie in
      content coverage, with similar methodological frameworks.
    basis: inferred

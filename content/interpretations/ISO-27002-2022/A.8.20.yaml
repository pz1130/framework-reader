control_id: ISO-27002-2022:A.8.20
locale: en
state: draft
fields:
  intent:
    value: The concern is preventing 'once connected to the network, systems can freely communicate with
      each other, with no boundaries on the link'—where internal and external networks, wireless and wired,
      office and business networks are mixed together, allowing attackers to move laterally unimpeded,
      and sensitive data is intercepted or tampered with during transmission without anyone noticing.
    basis: inferred
  plain_zh:
    value: Segment the network according to security boundaries, with controlled devices (firewalls, gateways,
      routers, etc.) guarding each segment, clearly defining who can communicate with whom; wireless access
      should have its own rules, requiring authorization before connection; data transmitted over the
      network should be encrypted to prevent tampering; idle connections should time out and disconnect.
    basis: inferred
  practice:
    value:
      '1': Have a network topology diagram and segmentation list; firewalls isolate external-to-internal
        and office-to-production networks; wireless networks are separated from wired networks; use encryption
        protocols for transmitting sensitive data.
      '2': Boundary devices have access control policies that are regularly reviewed; wireless access
        requires authentication and device registration; communication between critical network segments
        uses whitelisting or default-deny rules; idle sessions have timeout disconnection mechanisms;
        transmission encryption covers major business systems.
      '3': Network partitioning and security architecture are planned together; boundary policy changes
        go through approval and are traceable; wireless access has continuous monitoring and anomaly alerts;
        all inter-segment communication is default-deny with per-rule allowlisting; transmission encryption
        is a mandatory baseline with verification mechanisms to block plaintext fallback; boundary device
        status and policies have automated checks.
    basis: inferred
  evidence:
    value: Network topology diagrams and segmentation documentation, firewall and router policy configurations
      with review records, wireless access point inventory and authentication configurations, encryption
      protocol configuration screenshots or baseline documents, idle session timeout configurations, and
      boundary device alerts and audit logs.
    basis: inferred
  common_myth:
    value: Assuming 'installing a firewall means having boundary protection'—firewall policies are only
      added over time, never removed, allowing any-to-any traffic, or internal segments are left unprotected,
      so once an attacker breaches the perimeter, they move freely within the network. What the policy
      configuration is, who maintains it, and whether it is reviewed matter more than whether the device
      exists.
    basis: inferred
  auditor_asks:
    value:
    - When was the access control rule between the office area and R&D area in the internal network last
      reviewed? Who approved it?
    - Is there isolation between the wireless and wired networks? Can the guest network access any internal
      segment?
    - Which ports and services are open between production and test environments? Is there a whitelist?
    basis: inferred
  regional_note:
    value: null
    basis: inferred

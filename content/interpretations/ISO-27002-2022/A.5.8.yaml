control_id: ISO-27002-2022:A.5.8
locale: zh-CN
state: confirmed
fields:
  intent:
    value: 防的是「安全控制只在设计文档里存在，系统里没落地」——项目从立项、采购、开发到上线，安全安排如果不写进项目计划、不配资源、不指定责任，后期补课的成本和风险都会失控。
    basis: inferred
  plain_zh:
    value: 让每个项目在启动时就明确自己带了哪些安全安排——谁负责、资源够不够、进度里有没有留安全活的档期——而不是等安全团队事后去查。
    basis: inferred
  practice:
    value:
      '1': 项目立项时有安全负责人；项目计划里有安全任务清单；重大安全活动（如渗透测试）排进了进度。
      '2': 项目章程或计划文档写明安全角色、职责、关键节点和资源估算；变更时安全安排跟着走评审；有书面记录。
      '3': 安全安排与项目全生命周期（立项、采购、开发、测试、上线、运维）各阶段的活动和责任人绑定；安全任务有验收标准；上线前有安全放行门禁。
    basis: inferred
  evidence:
    value: 项目章程或项目计划中包含安全角色、活动与里程碑的部分；安全负责人任命邮件或会议纪要；项目变更单中涉及安全安排的记录；上线评审中安全放行/否决的签核记录。
    basis: inferred
  common_myth:
    value: 以为「安全团队参与了项目例会」就算安排了安全。没有书面的角色、责任和资源承诺，参与只是旁听——出了事没人认领，审计也没法验证。
    basis: inferred
  auditor_asks:
    value:
    - 这个项目的安全负责人是谁？写在哪个文件里？
    - 项目计划里哪几个里程碑是安全相关的？延期了谁负责报告？
    basis: inferred
  regional_note:
    value: null
    basis: inferred

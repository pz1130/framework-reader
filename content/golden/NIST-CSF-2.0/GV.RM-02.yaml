control_id: NIST-CSF-2.0:GV.RM-02
locale: zh-CN
state: confirmed
fields:
  intent:
    value: "防的是「风险偏好」停在高管口头或 PPT 里——业务与安全不知道什么算可接受、什么必须升级，同样事件有人压、有人喊停。"
    basis: practitioner
  plain_zh:
    value: "把风险偏好和风险容忍度写成能传达的表述，让相关人知道边界，并随业务与威胁变化维护更新。"
    basis: practitioner
  practice:
    value:
      "1": "有一份经管理层认可的风险偏好/容忍度文字，能指给审计员看。"
      "2": "偏好与容忍度落到可操作阈值（如事件升级、例外审批门槛），相关职能知晓。"
      "3": "定期回顾并与实际风险决策对账；重大战略变化时主动修订并重新传达。"
    basis: practitioner
  evidence:
    value: "经批准的风险偏好与容忍度文件、传达记录（会议纪要或培训签到）、例外与升级按阈值执行的案例、修订历史。"
    basis: practitioner
  common_myth:
    value: "以为贴一句「我们采取审慎的风险态度」就算有风险偏好。没有可操作边界时，业务例外和安全否决权仍然靠职位高低拍板，文件等于没写。"
    basis: practitioner
  auditor_asks:
    value:
      - "业务想上一个明显超风险容忍度的例外时，拒绝或升级的依据写在哪一页？"
      - "上次修订风险偏好是什么触发的？谁签的字、怎么传到一线？"
    basis: practitioner
  regional_note:
    value: null
    basis: practitioner
